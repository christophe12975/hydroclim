// ---- UTILITAIRES ----
function parseNum(v){
  if(v===null||v===undefined||v==="")return null;
  const n=parseFloat(String(v).replace(",","."));
  return isNaN(n)?null:n;
}
function getYear(ds){
  if(!ds)return null;
  const s=String(ds).trim();
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s))return parseInt(s.split("/")[2]);
  if(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s)){
    const p=s.split("/"),yr=parseInt(p[2]);
    return yr<100?(yr<=30?2000+yr:1900+yr):yr;
  }
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return parseInt(s.substring(0,4));
  const n=parseFloat(s);
  if(!isNaN(n)&&n>10000&&n<100000)
    return new Date(new Date(1899,11,30).getTime()+Math.floor(n)*86400000).getFullYear();
  const d=new Date(s);return isNaN(d.getTime())?null:d.getFullYear();
}
function getDOY(ds){
  const s=String(ds).trim();
  let day,month,year;
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){const p=s.split("/");day=+p[0];month=+p[1];year=+p[2];}
  else if(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s)){
    const p=s.split("/");month=+p[0];day=+p[1];const yr=+p[2];
    year=yr<100?(yr<=30?2000+yr:1900+yr):yr;
  }
  else{const d=new Date(s);if(isNaN(d.getTime()))return 1;return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);}
  const d=new Date(year,month-1,day);
  return Math.floor((d-new Date(year,0,0))/86400000);
}
function pct(arr,p){
  if(!arr.length)return null;
  const s=[...arr].sort((a,b)=>a-b);
  const idx=(p/100)*(s.length-1);
  const lo=Math.floor(idx),hi=Math.ceil(idx);
  return lo===hi?s[lo]:s[lo]+(s[hi]-s[lo])*(idx-lo);
}
function maxRun(arr,cond){let mx=0,cur=0;for(const v of arr){if(cond(v)){cur++;if(cur>mx)mx=cur;}else cur=0;}return mx;}
function sumRuns(arr,cond,ml){let t=0,i=0;while(i<arr.length){if(cond(arr[i])){let j=i;while(j<arr.length&&cond(arr[j]))j++;if((j-i)>=ml)t+=(j-i);i=j;}else i++;}return t;}

// ---- AUTH ----
async function doLogin(email,pass){
  const{data,error}=await supa.auth.signInWithPassword({email,password:pass});
  if(error)throw new Error(trad(error.message));
  let{data:prof}=await supa.from("profiles").select("*").eq("id",data.user.id).single();
  if(!prof){
    const meta=data.user.user_metadata||{};
    const{data:np}=await supa.from("profiles").insert({
      id:data.user.id,nom:meta.nom||email.split("@")[0],
      identifiant:meta.identifiant||email.split("@")[0],
      institution:meta.institution||"",role:meta.role||"scientifique"
    }).select().single();
    prof=np;
  }
  return prof;
}
async function doRegister(nom,email,ident,pass,inst,role){
  const{error}=await supa.auth.signUp({email,password:pass,
    options:{data:{nom,identifiant:ident,institution:inst,role}}});
  if(error)throw new Error(trad(error.message));
}
async function doLogout(){await supa.auth.signOut();setState({user:null,screen:"accueil"});}
function trad(m){
  if(!m)return"Erreur.";
  if(m.includes("already registered"))return"Email deja utilise.";
  if(m.includes("Email not confirmed"))return"Verifie ta boite mail.";
  if(m.includes("Invalid login credentials"))return"Email ou mot de passe incorrect.";
  if(m.includes("Password should be"))return"Mot de passe trop court.";
  return m;
}

// ---- CALCUL PRECIP ----
function calcPrecip(data){
  if(!data||!data.length)return null;
  const cols=Object.keys(data[0]);
  const dc=cols.find(c=>c.toLowerCase().includes("date"))||cols[0];
  const sts=cols.filter(c=>c!==dc);
  const yrs=[...new Set(data.map(r=>getYear(r[dc])).filter(Boolean))].sort((a,b)=>a-b);
  const res={};
  sts.forEach(st=>{
    const PRCPTOT=[],RX1day=[],Rx5day=[],R10=[],R20=[],SDII=[],CDD=[],CWD=[];
    yrs.forEach(an=>{
      const rows=data.filter(r=>getYear(r[dc])===an);
      const P=rows.map(r=>{const v=parseNum(r[st]);return(v===null||isNaN(v))?0:v;});
      const wet=P.map(p=>p>=1.0);
      const wv=P.filter((_,i)=>wet[i]);
      PRCPTOT.push(+wv.reduce((a,b)=>a+b,0).toFixed(2));
      RX1day.push(+Math.max(...P).toFixed(2));
      let mx5=0;
      for(let i=0;i<=P.length-5;i++){const s5=P[i]+P[i+1]+P[i+2]+P[i+3]+P[i+4];if(s5>mx5)mx5=s5;}
      Rx5day.push(+mx5.toFixed(2));
      R10.push(P.filter(p=>p>=10).length);
      R20.push(P.filter(p=>p>=20).length);
      SDII.push(wv.length>0?+(wv.reduce((a,b)=>a+b,0)/wv.length).toFixed(3):0);
      CDD.push(maxRun(P,p=>p<1.0));
      CWD.push(maxRun(P,p=>p>=1.0));
    });
    res[st]={annees:yrs,PRCPTOT,RX1day,Rx5day,R10,R20,SDII,CDD,CWD};
  });
  return res;
}

// ---- CALCUL TEMP ----
function calcTemp(dataTX,dataTN){
  if(!dataTX||!dataTX.length||!dataTN||!dataTN.length)return null;
  const cols=Object.keys(dataTX[0]);
  const dc=cols.find(c=>c.toLowerCase().includes("date"))||cols[0];
  const sts=cols.filter(c=>c!==dc);
  const colsTN=Object.keys(dataTN[0]);
  const dcTN=colsTN.find(c=>c.toLowerCase().includes("date"))||colsTN[0];
  const yrs=[...new Set(dataTX.map(r=>getYear(r[dc])).filter(Boolean))].sort((a,b)=>a-b);
  const ref0=yrs[0],ref1=ref0+29;
  const res={};
  sts.forEach(st=>{
    const stTN=colsTN.find(c=>c!==dcTN&&c.toLowerCase().replace(/[^a-z]/g,"")==st.toLowerCase().replace(/[^a-z]/g,""))||colsTN.find(c=>c!==dcTN);
    const TX=dataTX.map(r=>parseNum(r[st]));
    const TN=dataTN.map(r=>parseNum(r[stTN]));
    const nr=Math.min(TX.length,TN.length);
    const doys=dataTX.slice(0,nr).map(r=>getDOY(r[dc]));
    const yall=dataTX.slice(0,nr).map(r=>getYear(r[dc]));
    const inRef=yall.map(y=>y!==null&&y>=ref0&&y<=ref1);
    const TXr=TX.filter((_,i)=>inRef[i]&&TX[i]!==null);
    const TNr=TN.filter((_,i)=>inRef[i]&&TN[i]!==null);
    const dr=doys.filter((_,i)=>inRef[i]);
    const p10TX=new Array(367).fill(null),p90TX=new Array(367).fill(null);
    const p10TN=new Array(367).fill(null),p90TN=new Array(367).fill(null);
    for(let j=1;j<=366;j++){
      const win=[];
      for(let d=j-5;d<=j+5;d++)win.push(((d-1)%366+366)%366+1);
      const mTX=dr.map(d=>win.includes(d));
      const txW=TXr.filter((_,i)=>mTX[i]);
      const tnW=TNr.filter((_,i)=>mTX[i]);
      if(txW.length>=5){p10TX[j]=pct(txW,10);p90TX[j]=pct(txW,90);}
      if(tnW.length>=5){p10TN[j]=pct(tnW,10);p90TN[j]=pct(tnW,90);}
    }
    const t10x=doys.map(d=>p10TX[Math.min(d,366)]);
    const t90x=doys.map(d=>p90TX[Math.min(d,366)]);
    const t10n=doys.map(d=>p10TN[Math.min(d,366)]);
    const t90n=doys.map(d=>p90TN[Math.min(d,366)]);
    const SU25=[],TR20=[],TN10p=[],TX10p=[],TN90p=[],TX90p=[],WSDI=[],CSDI=[],DTR=[];
    yrs.forEach(an=>{
      const idx=[];for(let i=0;i<nr;i++)idx.push(yall[i]===an);
      const n=idx.filter(Boolean).length;
      if(n===0){SU25.push(0);TR20.push(0);TN10p.push(0);TX10p.push(0);TN90p.push(0);TX90p.push(0);WSDI.push(0);CSDI.push(0);DTR.push(null);return;}
      const tx=TX.filter((_,i)=>idx[i]);
      const tn=TN.filter((_,i)=>idx[i]);
      const _t10x=t10x.filter((_,i)=>idx[i]);
      const _t90x=t90x.filter((_,i)=>idx[i]);
      const _t10n=t10n.filter((_,i)=>idx[i]);
      const _t90n=t90n.filter((_,i)=>idx[i]);
      SU25.push(tx.filter(v=>v!==null&&v>25).length);
      TR20.push(tn.filter(v=>v!==null&&v>20).length);
      TN10p.push(+(100*tn.filter((v,i)=>v!==null&&_t10n[i]!==null&&v<_t10n[i]).length/n).toFixed(3));
      TX10p.push(+(100*tx.filter((v,i)=>v!==null&&_t10x[i]!==null&&v<_t10x[i]).length/n).toFixed(3));
      TN90p.push(+(100*tn.filter((v,i)=>v!==null&&_t90n[i]!==null&&v>_t90n[i]).length/n).toFixed(3));
      TX90p.push(+(100*tx.filter((v,i)=>v!==null&&_t90x[i]!==null&&v>_t90x[i]).length/n).toFixed(3));
      const dv=tx.map((v,i)=>v!==null&&tn[i]!==null?v-tn[i]:null).filter(v=>v!==null);
      DTR.push(dv.length>0?+(dv.reduce((a,b)=>a+b,0)/dv.length).toFixed(3):null);
      WSDI.push(sumRuns(tx.map((v,i)=>v!==null&&_t90x[i]!==null&&v>_t90x[i]),v=>v,6));
      CSDI.push(sumRuns(tn.map((v,i)=>v!==null&&_t10n[i]!==null&&v<_t10n[i]),v=>v,6));
    });
    res[st]={annees:yrs,SU25,TR20,TN10p,TX10p,TN90p,TX90p,WSDI,CSDI,DTR};
  });
  return res;
}

// ---- CALCUL DEBITS ----
function calcDebits(data){
  if(!data||!data.length)return null;
  const cols=Object.keys(data[0]);
  const dc=cols.find(c=>c.toLowerCase().includes("date"))||cols[0];
  const qc=cols.find(c=>c!==dc)||cols[1];
  const yrs=[...new Set(data.map(r=>getYear(r[dc])).filter(Boolean))].sort((a,b)=>a-b);
  const Q5=[],Q10=[],Q50=[],Q90=[],Q95=[],Qmoy=[],Qmin=[],Qmax=[];
  yrs.forEach(an=>{
    const vals=data.filter(r=>getYear(r[dc])===an).map(r=>parseNum(r[qc])).filter(v=>v!==null&&!isNaN(v)).sort((a,b)=>a-b);
    if(!vals.length){Q5.push(null);Q10.push(null);Q50.push(null);Q90.push(null);Q95.push(null);Qmoy.push(null);Qmin.push(null);Qmax.push(null);return;}
    Q5.push(+pct(vals,5).toFixed(3));Q10.push(+pct(vals,10).toFixed(3));Q50.push(+pct(vals,50).toFixed(3));
    Q90.push(+pct(vals,90).toFixed(3));Q95.push(+pct(vals,95).toFixed(3));
    Qmoy.push(+(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(3));
    Qmin.push(+Math.min(...vals).toFixed(3));Qmax.push(+Math.max(...vals).toFixed(3));
  });
  return{annees:yrs,Q5,Q10,Q50,Q90,Q95,Qmoy,Qmin,Qmax};
}

// ---- SPEARMAN ----
function rngs(arr){
  const v=arr.map((x,i)=>({x,i})).filter(a=>a.x!==null&&!isNaN(a.x));
  v.sort((a,b)=>a.x-b.x);
  const r=new Array(arr.length).fill(null);
  let i=0;
  while(i<v.length){
    let j=i;while(j+1<v.length&&v[j+1].x===v[i].x)j++;
    const rm=(i+j)/2+1;for(let k=i;k<=j;k++)r[v[k].i]=rm;i=j+1;
  }
  return r;
}
function spearman(x,y){
  const pairs=x.map((v,i)=>({x:v,y:y[i]})).filter(p=>p.x!==null&&p.y!==null&&!isNaN(p.x)&&!isNaN(p.y));
  const n=pairs.length;
  if(n<3)return{rho:null,pval:null,n};
  const rx=rngs(pairs.map(p=>p.x)),ry=rngs(pairs.map(p=>p.y));
  const mx=rx.reduce((a,b)=>a+b,0)/n,my=ry.reduce((a,b)=>a+b,0)/n;
  let num=0,dx=0,dy=0;
  for(let i=0;i<n;i++){num+=(rx[i]-mx)*(ry[i]-my);dx+=(rx[i]-mx)**2;dy+=(ry[i]-my)**2;}
  const rho=(dx&&dy)?num/Math.sqrt(dx*dy):0;
  const t=rho*Math.sqrt(n-2)/Math.sqrt(Math.max(1e-10,1-rho*rho));
  return{rho:+rho.toFixed(4),pval:+tpv(Math.abs(t),n-2).toFixed(4),n};
}
function tpv(t,df){const x=df/(df+t*t);return Math.min(1,Math.max(0,ibeta(x,df/2,0.5)));}
function ibeta(x,a,b){
  if(x<=0)return 0;if(x>=1)return 1;
  const lb=lgm(a)+lgm(b)-lgm(a+b);
  return Math.exp(Math.log(x)*a+Math.log(1-x)*b-lb)/a*bcf(x,a,b);
}
function bcf(x,a,b){
  let am=1,bm=1,az=1,qab=a+b,qap=a+1,qam=a-1,bz=1-qab*x/qap;
  for(let m=1;m<=100;m++){
    const em=m,tem=2*em;
    let d=em*(b-m)*x/((qam+tem)*(a+tem));
    let ap=az+d*am,bp=bz+d*bm;
    d=-(a+em)*(qab+em)*x/((a+tem)*(qap+tem));
    let app=ap+d*az,bpp=bp+d*bz,old=az;
    am=ap/bpp;bm=bp/bpp;az=app/bpp;bz=1;
    if(Math.abs(az-old)<3e-7*Math.abs(az))return az;
  }
  return az;
}
function lgm(x){
  const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let y=x,tmp=x+5.5,ser=1.000000000190015;
  tmp-=(x+0.5)*Math.log(tmp);
  for(let j=0;j<6;j++){y++;ser+=c[j]/y;}
  return -tmp+Math.log(2.5066282746310005*ser/x);
}
function calcMat(base,debits){
  if(!base||base.length<3)return null;
  const inds=["PRCPTOT","RX1day","Rx5day","R10","R20","SDII","CDD","CWD","SU25","TR20","TN10p","TX10p","TN90p","TX90p","WSDI","CSDI"];
  const mat={};
  inds.forEach(idx=>{
    mat[idx]={};
    const x=base.map(r=>parseNum(r[idx]));
    debits.forEach(d=>{mat[idx][d]=spearman(x,base.map(r=>parseNum(r[d])));});
  });
  return{mat,debits,indices:inds.filter(i=>base[0].hasOwnProperty(i))};
}

function xls(sheets,fname){
  if(typeof XLSX==="undefined"){alert("XLSX non disponible.");return;}
  const wb=XLSX.utils.book_new();
  sheets.forEach(s=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s.data),s.name));
  XLSX.writeFile(wb,fname);
}
function lire(file,cb){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:"binary",cellDates:false});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(ws,{raw:false});
      if(!json||!json.length){alert("Fichier vide.");return;}
      cb(json);
    }catch(err){alert("Erreur: "+err.message);}
  };
  r.readAsBinaryString(file);
}
function heatColor(rho,pval){
  if(rho===null)return"#1a2f42";
  const sig=pval!==null&&pval<0.05,a=Math.abs(rho);
  if(rho>0)return sig?`rgb(0,${100+Math.round(a*180)},${140+Math.round(a*60)})`: `rgba(78,203,160,${0.1+a*0.4})`;
  return sig?`rgb(${150+Math.round(a*100)},40,40)`:`rgba(224,96,96,${0.1+a*0.4})`;
}

function sSpearman(){
  const r=S.spearmanResults;
  const qSel=(q,grp)=>{
    const colors={etiage:"#4a9fe0",crue:"#e06060"};
    const cur=grp==="etiage"?S.spearmanQetiage:S.spearmanQcrue;
    return`<div id="qbtn-${q}" style="flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;text-align:center;border:${cur===q?`1px solid ${colors[grp]}`:"1px solid #234055"};background:${cur===q?`rgba(${grp==="etiage"?"74,159,224":"220,80,80"},.15)`:"#0d2235"};color:${cur===q?colors[grp]:"#6a9080"};">${q}</div>`;
  };
  let heatHtml="";
  if(r){
    const{mat,debits,indices}=r;
    const sig=[];
    indices.forEach(idx=>debits.forEach(d=>{const c=mat[idx]&&mat[idx][d];if(c&&c.pval!==null&&c.pval<0.05)sig.push({idx,d,rho:c.rho,pval:c.pval});}));
    sig.sort((a,b)=>Math.abs(b.rho)-Math.abs(a.rho));
    const grps=[{l:"Precipitations",li:["PRCPTOT","RX1day","Rx5day","R10","R20","SDII","CDD","CWD"]},{l:"Temperatures",li:["SU25","TR20","TN10p","TX10p","TN90p","TX90p","WSDI","CSDI"]}];
    heatHtml=`<div class="card"><div class="card-title">Heatmap Spearman</div><div class="card-sub">* p &lt; 0.05 · ${sig.length} paires significatives</div><div style="overflow-x:auto;"><table style="border-collapse:collapse;font-size:10px;min-width:100%;"><thead><tr><th style="padding:4px 8px;color:#6a9080;text-align:left;border-bottom:1px solid #234055;">Indice</th>${debits.map(d=>`<th style="padding:4px 10px;color:#4ecba0;text-align:center;border-bottom:1px solid #234055;">${d}</th>`).join("")}</tr></thead><tbody>`;
    grps.forEach(grp=>{
      const list=grp.li.filter(i=>indices.includes(i));
      if(!list.length)return;
      heatHtml+=`<tr><td colspan="${debits.length+1}" style="padding:4px 8px;font-size:10px;font-weight:700;color:#5a7a6a;text-transform:uppercase;background:#0d1b2a;">${grp.l}</td></tr>`;
      list.forEach(idx=>{
        if(!mat[idx])return;
        heatHtml+=`<tr><td style="padding:5px 8px;color:#e8f4f0;font-weight:600;white-space:nowrap;border-bottom:1px solid #1a2f42;">${idx}</td>`;
        debits.forEach(d=>{
          const c=mat[idx]&&mat[idx][d];
          if(!c||c.rho===null){heatHtml+=`<td style="padding:5px 8px;text-align:center;background:#1a2f42;">-</td>`;return;}
          const bg=heatColor(c.rho,c.pval),s=c.pval!==null&&c.pval<0.05;
          heatHtml+=`<td style="padding:5px 8px;text-align:center;background:${bg};border:${s?"2px solid "+(c.rho>0?"#4ecba0":"#e06060"):"1px solid #0d1b2a"};border-radius:3px;"><span style="color:#fff;font-weight:${s?"700":"400"};">${c.rho.toFixed(2)}${s?"*":""}</span></td>`;
        });
        heatHtml+=`</tr>`;
      });
    });
    heatHtml+=`</tbody></table></div></div>`;
    if(sig.length){
      heatHtml+=`<div class="card"><div class="card-title">Paires significatives (${sig.length})</div>`;
      sig.forEach(p=>{
        const col=p.rho>0?"#4ecba0":"#e06060";
        heatHtml+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:#0d2235;border-radius:8px;margin-bottom:5px;"><span style="font-size:12px;color:#e8f4f0;font-weight:600;">${p.idx} → ${p.d}</span><div style="text-align:right;"><div style="font-size:12px;color:${col};font-weight:700;">rho=${p.rho>0?"+":""}${p.rho.toFixed(3)}*</div><div style="font-size:10px;color:#4a6a5a;">p=${p.pval.toFixed(4)}</div></div></div>`;
      });
      heatHtml+=`</div>`;
    }
  }
  return`${hdr("Analyse Spearman","Correlation + Heatmap",true)}<div class="content"><div class="card"><div class="card-title">Charger le fichier fusionne</div><div class="card-sub">Format: Annee | Q5 | Q50 | Q95 | PRCPTOT | ... | CSDI</div><div class="uz ${S.baseDirecte?"loaded":""}"><input type="file" id="fbase" accept=".xlsx,.xls,.csv"/><div class="ui">${S.baseDirecte?"OK":"📂"}</div><div class="ul">${S.baseDirecteFile||"Cliquer pour uploader"}</div><div class="uh">${S.baseDirecte?S.baseDirecte.length+" lignes · "+Object.keys(S.baseDirecte[0]).length+" colonnes":"Formats: .xlsx .xls .csv"}</div></div>${S.baseDirecte?`<div style="font-size:10px;color:#6a9080;padding:6px 8px;background:#0d2235;border-radius:6px;margin-top:8px;word-break:break-all;">${Object.keys(S.baseDirecte[0]).join(" | ")}</div>`:""}</div><div class="card"><div class="card-title">Choix des indicateurs</div><div style="margin-bottom:10px;"><div style="font-size:12px;color:#8ab5a5;margin-bottom:6px;font-weight:600;">Indicateur d etiage</div><div style="display:flex;gap:8px;">${["Q5","Q10"].map(q=>qSel(q,"etiage")).join("")}</div></div><div><div style="font-size:12px;color:#8ab5a5;margin-bottom:6px;font-weight:600;">Indicateur de crue</div><div style="display:flex;gap:8px;">${["Q90","Q95"].map(q=>qSel(q,"crue")).join("")}</div></div><div style="margin-top:10px;padding:8px;background:#0d2235;border-radius:8px;font-size:11px;color:#8ab5a5;text-align:center;">Debits: <strong style="color:#4ecba0;">${S.spearmanQetiage} · Q50 · ${S.spearmanQcrue}</strong></div></div><button class="btn-primary" onclick="runSpearman()">Calculer la matrice de Spearman</button>${r?'<button class="btn-secondary" onclick="expSpearman()">Exporter la matrice (Excel)</button>':""} ${heatHtml}</div>${drw()}`;
}

function sOS2(){return`${hdr("Variabilite CWT","Scalogrammes en ondelettes",true)}<div class="content"><div class="card"><div class="card-title">OS2 — En developpement</div><div class="ib">Les scalogrammes seront calcules automatiquement depuis les donnees importees.</div></div></div>${drw()}`;}
function sOS3(){return`${hdr("Relations de phase","XWT + WTC + Coherence",true)}<div class="content"><div class="card"><div class="card-title">OS3 — En developpement</div><div class="ib">Les 9 paires significatives seront calculees automatiquement.</div></div></div>${drw()}`;}
function sAlertes(){
  const r=S.debitResults;
  let body='<div class="alert alert-info">Calculez les percentiles de debits pour voir les alertes.</div>';
  if(r){
    const i=r.annees.length-1,an=r.annees[i];
    const q95=r.Q95[i],q5=r.Q5[i],q50=r.Q50[i];
    body=`<div class="card"><div class="card-title">Alertes — ${an}</div>${q95>500?'<div class="alert alert-error">Q95 = '+q95+' m3/s — Risque crue eleve</div>':''}${q5<5?'<div class="alert alert-error">Q5 = '+q5+' m3/s — Risque etiage severe</div>':''}<div style="font-size:12px;color:#8ab5a5;">Q5=${q5} · Q50=${q50} · Q95=${q95}</div></div>`;
  }
  return`${hdr("Alertes hydroclimatiques","Surveillance des seuils",true)}<div class="content">${body}</div>${drw()}`;
}
function sProfil(){
  return`${hdr("Mon profil",null,true)}<div class="content"><div class="card" style="text-align:center;padding:24px 16px;"><div class="avatar">👤</div><div style="font-size:16px;font-weight:700;color:#fff;">${S.user?.nom||"Utilisateur"}</div><div style="font-size:12px;color:#4ecba0;margin-top:3px;">${S.user?.role||"scientifique"}</div></div><div class="card"><div style="font-size:12px;color:#8ab5a5;line-height:2;"><div style="display:flex;justify-content:space-between;"><span>Institution</span><span style="color:#e8f4f0;">${S.user?.institution||"Non specifiee"}</span></div><div style="display:flex;justify-content:space-between;"><span>Bassin</span><span style="color:#e8f4f0;">Oueme a Bonou</span></div></div></div><button class="btn-danger" onclick="doLogout()">Se deconnecter</button></div>${drw()}`;
}

// ---- ACTIONS ----
async function subLogin(){
  const e=document.getElementById("le")?.value?.trim(),p=document.getElementById("lp")?.value;
  const btn=document.getElementById("lbtn"),al=document.getElementById("la");
  if(!e||!p){if(al)al.innerHTML='<div class="alert alert-error">Remplissez tous les champs.</div>';return;}
  if(btn){btn.disabled=true;btn.textContent="Connexion...";}
  try{const prof=await doLogin(e,p);setState({user:prof,screen:"dashboard"});}
  catch(err){if(al)al.innerHTML=`<div class="alert alert-error">${err.message}</div>`;if(btn){btn.disabled=false;btn.textContent="Se connecter";}}
}
async function subReg(){
  const n=document.getElementById("rn")?.value?.trim(),e=document.getElementById("re")?.value?.trim();
  const i=document.getElementById("ri")?.value?.trim(),p=document.getElementById("rp")?.value;
  const ins=document.getElementById("rin")?.value?.trim();
  const btn=document.getElementById("rbtn"),al=document.getElementById("ra");
  if(!n||!e||!i||!p||!ins){if(al)al.innerHTML='<div class="alert alert-error">Remplissez tous les champs.</div>';return;}
  if(btn){btn.disabled=true;btn.textContent="Creation...";}
  try{
    await doRegister(n,e,i,p,ins,S.authRole);
    setState({screen:"auth",authTab:"login"});
    setTimeout(()=>{const a=document.getElementById("la");if(a)a.innerHTML='<div class="alert alert-success">Compte cree ! Verifie ta boite mail.</div>';},100);
  }catch(err){if(al)al.innerHTML=`<div class="alert alert-error">${err.message}</div>`;if(btn){btn.disabled=false;btn.textContent="Creer mon compte";}}
}
function runETCCDI(){
  const precip=S.importData.precip,tmax=S.importData.tmax,tmin=S.importData.tmin;
  if(!precip&&!(tmax&&tmin)){alert("Chargez vos donnees dans Import.");return;}
  setState({etccdiStatus:"Calcul en cours..."});
  setTimeout(()=>{
    try{
      const precipR=precip?calcPrecip(precip):null;
      const tempR=(tmax&&tmin)?calcTemp(tmax,tmin):null;
      setState({etccdiResults:{precip:precipR,temp:tempR},etccdiStatus:"Calcul termine avec succes"});
    }catch(err){setState({etccdiStatus:"Erreur: "+err.message});}
  },100);
}
function expETCCDI(){
  const r=S.etccdiResults;if(!r)return;
  const sheets=[];
  if(r.precip){const sts=Object.keys(r.precip);const rows=[["Annee","Station","PRCPTOT","RX1day","Rx5day","R10","R20","SDII","CDD","CWD"]];sts.forEach(st=>{const d=r.precip[st];d.annees.forEach((an,i)=>rows.push([an,st,d.PRCPTOT[i],d.RX1day[i],d.Rx5day[i],d.R10[i],d.R20[i],d.SDII[i],d.CDD[i],d.CWD[i]]));});sheets.push({name:"Precipitations",data:rows});}
  if(r.temp){const sts=Object.keys(r.temp);const rows=[["Annee","Station","SU25","TR20","TN10p","TX10p","TN90p","TX90p","WSDI","CSDI","DTR"]];sts.forEach(st=>{const d=r.temp[st];d.annees.forEach((an,i)=>rows.push([an,st,d.SU25[i],d.TR20[i],d.TN10p[i],d.TX10p[i],d.TN90p[i],d.TX90p[i],d.WSDI[i],d.CSDI[i],d.DTR[i]]));});sheets.push({name:"Temperatures",data:rows});}
  xls(sheets,"Indices_ETCCDI.xlsx");
}
function expDebits(){
  const r=S.debitResults;if(!r)return;
  const rows=[["Annee","Q5","Q10","Q50","Q90","Q95","Qmoy","Qmin","Qmax"]];
  r.annees.forEach((an,i)=>rows.push([an,r.Q5[i],r.Q10[i],r.Q50[i],r.Q90[i],r.Q95[i],r.Qmoy[i],r.Qmin[i],r.Qmax[i]]));
  xls([{name:"Percentiles",data:rows}],"Percentiles_Debits.xlsx");
}
function runSpearman(){
  const base=S.baseDirecte;
  if(!base||base.length<3){alert("Chargez le fichier Excel fusionne.");return;}
  const cols=Object.keys(base[0]);
  const ac=cols.find(c=>c.toLowerCase().includes("ann")||c.toLowerCase().includes("year"))||cols[0];
  const dkws=["q5","q10","q50","q90","q95","qmoy"];
  let dc=cols.filter(c=>dkws.some(k=>c.toLowerCase().replace(/[^a-z0-9]/g,"")===k));
  if(!dc.length)dc=cols.slice(1,4);
  const chosen=[];
  ["Q50",S.spearmanQetiage,S.spearmanQcrue].forEach(q=>{
    const m=cols.find(c=>c.toLowerCase().replace(/[^a-z0-9]/g,"")==q.toLowerCase().replace(/[^a-z0-9]/g,""));
    if(m&&!chosen.includes(m))chosen.push(m);
  });
  const final=chosen.length?chosen:dc.slice(0,3);
  const indCols=cols.filter(c=>c!==ac&&!dc.includes(c));
  const mat={};
  indCols.forEach(idx=>{
    mat[idx]={};
    const x=base.map(r=>parseNum(r[idx]));
    final.forEach(d=>{mat[idx][d]=spearman(x,base.map(r=>parseNum(r[d])));});
  });
  setState({spearmanResults:{mat,debits:final,indices:indCols}});
}
function expSpearman(){
  const r=S.spearmanResults;if(!r)return;
  const{mat,debits,indices}=r;
  const rhoRows=[["Indice",...debits]];
  const pRows=[["Indice",...debits]];
  indices.forEach(idx=>{
    rhoRows.push([idx,...debits.map(d=>mat[idx]&&mat[idx][d]?mat[idx][d].rho:null)]);
    pRows.push([idx,...debits.map(d=>mat[idx]&&mat[idx][d]?mat[idx][d].pval:null)]);
  });
  xls([{name:"Rho_Spearman",data:rhoRows},{name:"P_values",data:pRows}],"Matrice_Spearman.xlsx");
}

// ---- EVENTS ----
function attachEvents(){
  // Import tabs
  ["precip","tmax","tmin","debit"].forEach(k=>{
    const el=document.getElementById("itab-"+k);
    if(el)el.onclick=()=>setState({importTab:k});
  });
  // File import
  const fi=document.getElementById("fimport");
  if(fi)fi.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    lire(f,data=>{
      const k=S.importTab;
      S.importData[k]=data;S.importFiles[k]=f.name;
      if(k==="debit")S.debitResults=null;
      setState({importTab:k});
    });
  };
  // Export buttons
  ["precip","tmax","tmin","debit"].forEach(k=>{
    const el=document.getElementById("ebtn-"+k);
    if(el)el.onclick=()=>{
      const d=S.importData[k];if(!d)return;
      const nm={precip:"Precipitations",tmax:"Tmax",tmin:"Tmin",debit:"Debits"};
      const fn={precip:"Precipitations_25stations.xlsx",tmax:"Tmax_4stations.xlsx",tmin:"Tmin_4stations.xlsx",debit:"Debits_Bonou.xlsx"};
      xls([{name:nm[k],data:[Object.keys(d[0]),...d.map(r=>Object.values(r))]}],fn[k]);
    };
  });
  // File base spearman
  const fb=document.getElementById("fbase");
  if(fb)fb.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    lire(f,data=>setState({baseDirecte:data,baseDirecteFile:f.name,spearmanResults:null}));
  };
  // Q buttons
  ["Q5","Q10"].forEach(q=>{
    const el=document.getElementById("qbtn-"+q);
    if(el)el.onclick=()=>setState({spearmanQetiage:q});
  });
  ["Q90","Q95"].forEach(q=>{
    const el=document.getElementById("qbtn-"+q);
    if(el)el.onclick=()=>setState({spearmanQcrue:q});
  });
}

// ---- RENDER ----
const SCR={
  accueil:sAccueil,auth:sAuth,dashboard:sDashboard,
  import:sImport,etccdi:sETCCDI,debits:sDebits,
  spearman:sSpearman,os2:sOS2,os3:sOS3,
  alertes:sAlertes,profil:sProfil,
};
function render(){
  document.getElementById("app").innerHTML=(SCR[S.screen]||sAccueil)();
  attachEvents();
}
render();
</script>
