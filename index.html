  if(!ds)return null;
  const s=String(ds).trim();
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s))return parseInt(s.split("/")[2]);
  if(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s)){
    const p=s.split("/"),yr=parseInt(p[2]);
    return yr<100?(yr<=30?2000+yr:1900+yr):yr;
  }
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return parseInt(s.substring(0,4));
  const n=parseFloat(s);
  if(!isNaN(n)&&n>10000&&n<100000)
    return new Date(new Date(1899,11,30).getTime()+Math.floor(n)*86400000).getFullYear();
  const d=new Date(s);return isNaN(d.getTime())?null:d.getFullYear();
}
function getDOY(ds){
  const s=String(ds).trim();
  let day,month,year;
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){const p=s.split("/");day=+p[0];month=+p[1];year=+p[2];}
  else if(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s)){
    const p=s.split("/");month=+p[0];day=+p[1];const yr=+p[2];
    year=yr<100?(yr<=30?2000+yr:1900+yr):yr;
  }
  else{const d=new Date(s);if(isNaN(d.getTime()))return 1;return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);}
  const d=new Date(year,month-1,day);
  return Math.floor((d-new Date(year,0,0))/86400000);
}
function pct(arr,p){
  if(!arr.length)return null;
  const s=[...arr].sort((a,b)=>a-b);
  const idx=(p/100)*(s.length-1);
  const lo=Math.floor(idx),hi=Math.ceil(idx);
  return lo===hi?s[lo]:s[lo]+(s[hi]-s[lo])*(idx-lo);
}

// Gestion de l'import d'image (conversion Base64 + Sauvegarde Supabase)
async function handleAvatarUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.src = e.target.result;

    img.onload = async function() {
      // Redimensionnement de l'image (max 200px)
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const maxSize = 200;
      let width = img.width;
      let height = img.height;

      if (width > height) {
        if (width > maxSize) {
          height *= maxSize / width;
          width = maxSize;
        }
      } else {
        if (height > maxSize) {
          width *= maxSize / height;
          height = maxSize;
        }
      }

      canvas.width = width;
      canvas.height = height;
      ctx.drawImage(img, 0, 0, width, height);

      // Conversion en image JPEG légère
      const compressedBase64 = canvas.toDataURL("image/jpeg", 0.8);

      // 1. Mise à jour de l'affichage direct et du LocalStorage
      S.user.avatar_url = compressedBase64;
      if (typeof setState === "function") setState({ user: S.user });
      localStorage.setItem("hydroclim_user", JSON.stringify(S.user));

      // 2. Sauvegarde permanente dans Supabase
      const { error } = await supa
        .from("profiles")
        .update({ avatar_url: compressedBase64 })
        .eq("id", S.user.id);

      if (error) {
        alert("Erreur d'enregistrement : " + error.message);
      } else {
        console.log("Photo enregistrée avec succès dans Supabase !");
      }
    };
  };
  reader.readAsDataURL(file);
}

async function doLogin(email, pass) {
  const { data, error } = await supa.auth.signInWithPassword({ email, password: pass });
  if (error) throw new Error(trad(error.message));

  // Récupère le profil à jour depuis la base Supabase
  let { data: prof } = await supa.from("profiles").select("*").eq("id", data.user.id).single();

  if (!prof) {
    const meta = data.user.user_metadata || {};
    const { data: np } = await supa.from("profiles").insert({
      id: data.user.id,
      nom: meta.nom || email.split("@")[0],
      identifiant: meta.identifiant || email.split("@")[0],
      institution: meta.institution || ""
    }).select().single();
    prof = np;
    prof.email = data.user.email;
    prof.last_sign_in_at = data.user.last_sign_in_at;
  }

  // Stocke la version à jour (avec la dernière photo) dans le localStorage
  localStorage.setItem("hydroclim_user", JSON.stringify(prof));

// ---- CALCUL PRECIP (Fidèle au script MATLAB) ----
function calcPrecip(data){
  if(!data||!data.length)return null;
  const cols=Object.keys(data[0]);
  const dc=cols.find(c=>c.toLowerCase().includes("date"))||cols[0];
  const sts=cols.filter(c=>c!==dc);
  const yrs=[...new Set(data.map(r=>getYear(r[dc])).filter(Boolean))].sort((a,b)=>a-b);
  const res={};
  
  sts.forEach(st=>{
    const PRCPTOT=[],RX1day=[],Rx5day=[],R10=[],R20=[],SDII=[],CDD=[],CWD=[];
    
    // Extraire et nettoyer la colonne P
    const P = data.map(r=>{
      const v = parseNum(r[st]);
      return (v===null||isNaN(v))?0:v;
    });

    yrs.forEach(an=>{
      const rowsIdx = data.map((r,i)=>getYear(r[dc])===an);
      const Py = P.filter((_,i)=>rowsIdx[i]);
      if(!Py.length){
        PRCPTOT.push(0); RX1day.push(0); Rx5day.push(0); R10.push(0); R20.push(0); SDII.push(0); CDD.push(0); CWD.push(0);
        return;
      }
      
      const wet = Py.map(p=>p>=1.0);
      const dry = wet.map(w=>!w);

      // PRCPTOT = somme des jours >= 1mm
      const wetVals = Py.filter((_,i)=>wet[i]);
      PRCPTOT.push(wetVals.reduce((a,b)=>a+b,0));

      // RX1day = max journalier
      RX1day.push(Math.max(...Py));

      // Rx5day = max glissant sur 5 jours (movsum [0 4])
      let mx5=0;
      const n5 = Py.length - 4;
      if(n5 > 0){
        for(let i=0; i<n5; i++){
          let s5 = Py[i]+Py[i+1]+Py[i+2]+Py[i+3]+Py[i+4];
          if(s5 > mx5) mx5 = s5;
        }
      } else {
        mx5 = Py.reduce((a,b)=>a+b,0);
      }
      Rx5day.push(mx5);

      // R10 et R20
      R10.push(Py.filter(p=>p>=10.0).length);
      R20.push(Py.filter(p=>p>=20.0).length);

      // SDII
      SDII.push(wetVals.length>0 ? (wetVals.reduce((a,b)=>a+b,0)/wetVals.length) : 0);

      // CDD (Consecutive Dry Days, < 1.0mm)
      let max_len=0, cur=0;
      for(let i=0; i<dry.length; i++){
        if(dry[i]){ cur++; if(cur>max_len) max_len=cur; }
        else { cur=0; }
      }
      CDD.push(max_len);

      // CWD (Consecutive Wet Days, >= 1.0mm)
      max_len=0; cur=0;
      for(let i=0; i<wet.length; i++){
        if(wet[i]){ cur++; if(cur>max_len) max_len=cur; }
        else { cur=0; }
      }
      CWD.push(max_len);
    });

    res[st]={annees:yrs,PRCPTOT,RX1day,Rx5day,R10,R20,SDII,CDD,CWD};
  });
  return res;
}

// ---- CALCUL TEMP (Fidèle au script MATLAB) ----
function calcTemp(dataTX,dataTN){
  if(!dataTX||!dataTX.length||!dataTN||!dataTN.length)return null;
  const cols=Object.keys(dataTX[0]);
  const dc=cols.find(c=>c.toLowerCase().includes("date"))||cols[0];
  const sts=cols.filter(c=>c!==dc);
  const colsTN=Object.keys(dataTN[0]);
  const dcTN=colsTN.find(c=>c.toLowerCase().includes("date"))||colsTN[0];
  const yrs=[...new Set(dataTX.map(r=>getYear(r[dc])).filter(Boolean))].sort((a,b)=>a-b);
  
  const ref_debut = yrs[0];
  const ref_fin = ref_debut + 29;
  const seqlen = 6;
  const res={};

  sts.forEach(st=>{
    const stTN=colsTN.find(c=>c!==dcTN&&c.toLowerCase().replace(/[^a-z]/g,"")==st.toLowerCase().replace(/[^a-z]/g,""))||colsTN.find(c=>c!==dcTN);
    const TX=dataTX.map(r=>parseNum(r[st]));
    const TN=dataTN.map(r=>parseNum(r[stTN]));
    const nr=Math.min(TX.length,TN.length);
    const doys=dataTX.slice(0,nr).map(r=>getDOY(r[dc]));
    const yall=dataTX.slice(0,nr).map(r=>getYear(r[dc]));

    // Percentiles sur période de référence (ref_debut à ref_fin)
    const inRef=yall.map(y=>y!==null&&y>=ref_debut&&y<=ref_fin);
    const TXr=TX.filter((_,i)=>inRef[i]&&TX[i]!==null);
    const TNr=TN.filter((_,i)=>inRef[i]&&TN[i]!==null);
    const dr=doys.filter((_,i)=>inRef[i]);

    const p10TX=new Array(367).fill(null),p90TX=new Array(367).fill(null);
    const p10TN=new Array(367).fill(null),p90TN=new Array(367).fill(null);

    for(let j=1; j<=366; j++){
      // Fenêtre glissante de 11 jours centrée mod 366
      const win=[];
      for(let d=j-5; d<=j+5; d++){
        win.push(((d-1)%366+366)%366+1);
      }
      const mTX=dr.map(d=>win.includes(d));
      const txW=TXr.filter((_,i)=>mTX[i]);
      const tnW=TNr.filter((_,i)=>mTX[i]);
      if(txW.length>=5){
        p10TX[j]=pct(txW,10); p90TX[j]=pct(txW,90);
      }
      if(tnW.length>=5){
        p10TN[j]=pct(tnW,10); p90TN[j]=pct(tnW,90);
      }
    }

    const thr_TX10 = doys.map(d=>p10TX[Math.min(d,366)]);
    const thr_TX90 = doys.map(d=>p90TX[Math.min(d,366)]);
    const thr_TN10 = doys.map(d=>p10TN[Math.min(d,366)]);
    const thr_TN90 = doys.map(d=>p90TN[Math.min(d,366)]);

    const SU25=[],TR20=[],TN10p=[],TX10p=[],TN90p=[],TX90p=[],WSDI=[],CSDI=[],DTR=[];

    yrs.forEach(an=>{
      const idx = yall.map(y=>y===an);
      const n = idx.filter(Boolean).length;
      if(n===0){
        SU25.push(0); TR20.push(0); TN10p.push(0); TX10p.push(0); TN90p.push(0); TX90p.push(0); WSDI.push(0); CSDI.push(0); DTR.push(null);
        return;
      }
      const tx = TX.filter((_,i)=>idx[i]);
      const tn = TN.filter((_,i)=>idx[i]);
      const t10x = thr_TX10.filter((_,i)=>idx[i]);
      const t90x = thr_TX90.filter((_,i)=>idx[i]);
      const t10n = thr_TN10.filter((_,i)=>idx[i]);
      const t90n = thr_TN90.filter((_,i)=>idx[i]);

      SU25.push(tx.filter(v=>v!==null&&v>25).length);
      TR20.push(tn.filter(v=>v!==null&&v>20).length);
      TN10p.push(100*tn.filter((v,i)=>v!==null&&t10n[i]!==null&&v<t10n[i]).length/n);
      TX10p.push(100*tx.filter((v,i)=>v!==null&&t10x[i]!==null&&v<t10x[i]).length/n);
      TN90p.push(100*tn.filter((v,i)=>v!==null&&t90n[i]!==null&&v>t90n[i]).length/n);
      TX90p.push(100*tx.filter((v,i)=>v!==null&&t90x[i]!==null&&v>t90x[i]).length/n);

      const dv = tx.map((v,i)=>v!==null&&tn[i]!==null?v-tn[i]:null).filter(v=>v!==null);
      DTR.push(dv.length>0 ? (dv.reduce((a,b)=>a+b,0)/dv.length) : null);

      // WSDI (Spell length >= seqlen where tx > t90x)
      const hot = tx.map((v,i)=>v!==null&&t90x[i]!==null&&v>t90x[i]);
      let total_w=0, i=0;
      while(i<hot.length){
        if(hot[i]){
          let j=i; while(j<hot.length&&hot[j]) j++;
          if((j-i)>=seqlen) total_w+=(j-i);
          i=j;
        } else { i++; }
      }
      WSDI.push(total_w);

      // CSDI (Spell length >= seqlen where tn < t10n)
      const cold = tn.map((v,i)=>v!==null&&t10n[i]!==null&&v<t10n[i]);
      let total_c=0, ii=0;
      while(ii<cold.length){
        if(cold[ii]){
          let jj=ii; while(jj<cold.length&&cold[jj]) jj++;
          if((jj-ii)>=seqlen) total_c+=(jj-ii);
          ii=jj;
        } else { ii++; }
      }
      CSDI.push(total_c);
    });

    res[st]={annees:yrs,SU25,TR20,TN10p,TX10p,TN90p,TX90p,WSDI,CSDI,DTR};
  });
  return res;
}

// ---- CALCUL DEBITS (Modifié : Q5, Q10, Q50, Q90, Q95 uniquement) ----
function calcDebits(data){
  if(!data||!data.length)return null;
  const cols=Object.keys(data[0]);
  const dc=cols.find(c=>c.toLowerCase().includes("date"))||cols[0];
  const qc=cols.find(c=>c!==dc)||cols[1];

  const Q5=[],Q10=[],Q50=[],Q90=[],Q95=[];

    if(!vals.length){Q5.push(null);Q10.push(null);Q50.push(null);Q90.push(null);Q95.push(null);return;}
    Q5.push(pct(vals,5));

    Q50.push(pct(vals,50));

  });

}

// ---- SPEARMAN ----
function rngs(arr){
  const v=arr.map((x,i)=>({x,i})).filter(a=>a.x!==null&&!isNaN(a.x));
  v.sort((a,b)=>a.x-b.x);
  const r=new Array(arr.length).fill(null);
  let i=0;
  while(i<v.length){
    let j=i;while(j+1<v.length&&v[j+1].x===v[i].x)j++;
    const rm=(i+j)/2+1;for(let k=i;k<=j;k++)r[v[k].i]=rm;i=j+1;
  }
  return r;
}
function spearman(x,y){
  const pairs=x.map((v,i)=>({x:v,y:y[i]})).filter(p=>p.x!==null&&p.y!==null&&!isNaN(p.x)&&!isNaN(p.y));
  const n=pairs.length;
  if(n<3)return{rho:null,pval:null,n};
  const rx=rngs(pairs.map(p=>p.x)),ry=rngs(pairs.map(p=>p.y));
  const mx=rx.reduce((a,b)=>a+b,0)/n,my=ry.reduce((a,b)=>a+b,0)/n;
  let num=0,dx=0,dy=0;
  for(let i=0;i<n;i++){num+=(rx[i]-mx)*(ry[i]-my);dx+=(rx[i]-mx)**2;dy+=(ry[i]-my)**2;}
  const rho=(dx&&dy)?num/Math.sqrt(dx*dy):0;
  const t=rho*Math.sqrt(n-2)/Math.sqrt(Math.max(1e-10,1-rho*rho));
  return{rho:+rho.toFixed(4),pval:+tpv(Math.abs(t),n-2).toFixed(4),n};
}
function tpv(t,df){const x=df/(df+t*t);return Math.min(1,Math.max(0,ibeta(x,df/2,0.5)));}
function ibeta(x,a,b){
  if(x<=0)return 0;if(x>=1)return 1;
  const lb=lgm(a)+lgm(b)-lgm(a+b);
  return Math.exp(Math.log(x)*a+Math.log(1-x)*b-lb)/a*bcf(x,a,b);
}
function bcf(x,a,b){
  let am=1,bm=1,az=1,qab=a+b,qap=a+1,qam=a-1,bz=1-qab*x/qap;
  for(let m=1;m<=100;m++){
    const em=m,tem=2*em;
    let d=em*(b-m)*x/((qam+tem)*(a+tem));
    let ap=az+d*am,bp=bz+d*bm;
    d=-(a+em)*(qab+em)*x/((a+tem)*(qap+tem));
    let app=ap+d*az,bpp=bp+d*bz,old=az;
    am=ap/bpp;bm=bp/bpp;az=app/bpp;bz=1;
    if(Math.abs(az-old)<3e-7*Math.abs(az))return az;
  }
  return az;
}
function lgm(x){
  const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let y=x,tmp=x+5.5,ser=1.000000000190015;
  tmp-=(x+0.5)*Math.log(tmp);
  for(let j=0;j<6;j++){y++;ser+=c[j]/y;}
  return -tmp+Math.log(2.5066282746310005*ser/x);
}
function heatColor(rho,pval){
  if(rho===null)return"#1a2f42";
  const sig=pval!==null&&pval<0.05,a=Math.abs(rho);
  if(rho>0)return sig?`rgb(0,${100+Math.round(a*180)},${140+Math.round(a*60)})`: `rgba(78,203,160,${0.1+a*0.4})`;
  return sig?`rgb(${150+Math.round(a*100)},40,40)`:`rgba(224,96,96,${0.1+a*0.4})`;
}

// ==================== CWT (Torrence & Compo 1998, Morlet) ====================
// FFT/IFFT radix-2 iteratif (re/im : Float64Array, longueur puissance de 2, modifie en place)
function fftRadix2(re,im,inverse){
  const n=re.length;
  for(let i=1,j=0;i<n;i++){
    let bit=n>>1;
    for(;j&bit;bit>>=1)j^=bit;
    j^=bit;
    if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]];}
  }
  for(let len=2;len<=n;len<<=1){
    const ang=(inverse?2:-2)*Math.PI/len;
    const wr=Math.cos(ang),wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){
      let cwr=1,cwi=0;
      for(let k=0;k<len/2;k++){
        const ur=re[i+k],ui=im[i+k];
        const vr=re[i+k+len/2]*cwr-im[i+k+len/2]*cwi;
        const vi=re[i+k+len/2]*cwi+im[i+k+len/2]*cwr;
        re[i+k]=ur+vr;im[i+k]=ui+vi;
        re[i+k+len/2]=ur-vr;im[i+k+len/2]=ui-vi;
        const nwr=cwr*wr-cwi*wi,nwi=cwr*wi+cwi*wr;
        cwr=nwr;cwi=nwi;
      }
    }
  }
  if(inverse)for(let i=0;i<n;i++){re[i]/=n;im[i]/=n;}
}
function nextPow2(n){let p=1;while(p<n)p<<=1;return p;}

// Regularized lower incomplete gamma P(a,x), via serie/fraction continue (Numerical Recipes)
function gammap(a,x){
  if(x<0||a<=0)return 0;
  if(x===0)return 0;
  if(x<a+1)return gser(a,x);
  return 1-gcf(a,x);
}
function gser(a,x){
  const ITMAX=200,EPS=3e-9;
  let ap=a,sum=1/a,del=sum;
  for(let n=1;n<=ITMAX;n++){
    ap+=1;del*=x/ap;sum+=del;
    if(Math.abs(del)<Math.abs(sum)*EPS)break;
  }
  return sum*Math.exp(-x+a*Math.log(x)-lgm(a));
}
function gcf(a,x){
  const ITMAX=200,EPS=3e-9,FPMIN=1e-300;
  let b=x+1-a,c=1/FPMIN,d=1/b,h=d;
  for(let i=1;i<=ITMAX;i++){
    const an=-i*(i-a);
    b+=2;d=an*d+b;if(Math.abs(d)<FPMIN)d=FPMIN;
    c=b+an/c;if(Math.abs(c)<FPMIN)c=FPMIN;
    d=1/d;const del=d*c;h*=del;
    if(Math.abs(del-1)<EPS)break;
  }
  return Math.exp(-x+a*Math.log(x)-lgm(a))*h;
}
// Inverse chi-square cdf normalisee (par bisection), equivalent chisquare_inv.m
function chisquareInv(P,V){
  let lo=1e-6,hi=1;
  while(gammap(V/2,hi/2*V)<P)hi*=2;
  for(let it=0;it<100;it++){
    const mid=(lo+hi)/2;
    if(gammap(V/2,mid/2*V)<P)lo=mid;else hi=mid;
  }
  return (lo+hi)/2*V;
}
function lag1Autocorr(x){
  const n=x.length,m=x.reduce((a,b)=>a+b,0)/n;
  let num=0,den=0;
  for(let i=0;i<n-1;i++)num+=(x[i]-m)*(x[i+1]-m);
  for(let i=0;i<n;i++)den+=(x[i]-m)**2;
  const a=den>0?num/den:0;
  return Math.max(0,Math.min(a,0.99));
}
// wavelet.m equivalent (Morlet uniquement, k0=6)
function waveletCWT(Y,dt,dj,s0,J1){
  const n1=Y.length,mean=Y.reduce((a,b)=>a+b,0)/n1;
  const n=nextPow2(n1);
  const xr=new Float64Array(n),xi=new Float64Array(n);
  for(let i=0;i<n1;i++)xr[i]=Y[i]-mean;
  fftRadix2(xr,xi,false); // f = fft(x), reutilise en place
  const k=new Float64Array(n);
  const half=Math.floor(n/2);
  for(let j=1;j<=half;j++)k[j]=j*(2*Math.PI/(n*dt));
  for(let j=half+1;j<n;j++)k[j]=-(n-j)*(2*Math.PI/(n*dt));
  const k0=6;
  const nScales=J1+1;
  const scale=new Array(nScales),period=new Array(nScales);
  const waveRe=[],waveIm=[];
  let fourier_factor=0,coi0=0;
  for(let a=0;a<nScales;a++){
    const sc=s0*Math.pow(2,a*dj);scale[a]=sc;
    // daughter Morlet (reelle)
    const dRe=new Float64Array(n),dIm=new Float64Array(n);
    for(let j=0;j<n;j++){
      if(k[j]>0){
        const expnt=-((sc*k[j]-k0)**2)/2;
        const norm=Math.sqrt(sc*k[1])*Math.pow(Math.PI,-0.25)*Math.sqrt(n);
        dRe[j]=norm*Math.exp(expnt);
      }
    }
    fourier_factor=(4*Math.PI)/(k0+Math.sqrt(2+k0*k0));
    coi0=fourier_factor/Math.sqrt(2);
    // produit f.*daughter (complexe), f=(xr,xi) reste inchange car reutilise a chaque scale
    const pr=new Float64Array(n),pi=new Float64Array(n);
    for(let j=0;j<n;j++){pr[j]=xr[j]*dRe[j]-xi[j]*dIm[j];pi[j]=xr[j]*dIm[j]+xi[j]*dRe[j];}
    fftRadix2(pr,pi,true); // ifft
    waveRe.push(Array.from(pr.slice(0,n1)));
    waveIm.push(Array.from(pi.slice(0,n1)));
    period[a]=fourier_factor*sc;
  }
  const coi=new Array(n1);
  for(let i=0;i<n1;i++){
    const tri=Math.min(i+1,n1-i);
    coi[i]=Math.max(coi0*dt*tri,1e-5);
  }
  return{waveRe,waveIm,scale,period,coi,fourier_factor};
}
// wave_signif.m — sigtest 0 (local) ou 1 (moyenne temporelle, GWS), Morlet k0=6 uniquement
function waveSignif(Y,dt,scale,sigtest,lag1,siglvl,N){
  const variance=(()=>{const n=Y.length,m=Y.reduce((a,b)=>a+b,0)/n;return Y.reduce((a,b)=>a+(b-m)**2,0)/(n-1);})();
  const k0=6,fourier_factor=(4*Math.PI)/(k0+Math.sqrt(2+k0*k0));
  const dofmin=2,gamma_fac=2.32;
  const period=scale.map(s=>s*fourier_factor);
  const fftTheor=period.map(p=>{
    const freq=dt/p;
    return variance*(1-lag1*lag1)/(1-2*lag1*Math.cos(freq*2*Math.PI)+lag1*lag1);
  });
  if(sigtest===0){
    const chisq=chisquareInv(siglvl,dofmin)/dofmin;
    return fftTheor.map(f=>f*chisq);
  }
  // sigtest 1 : dof variable par echelle (Eqn 23)
  return scale.map((s,a)=>{
    const dof=Math.max(dofmin*Math.sqrt(1+((N*dt/gamma_fac)/s)**2),dofmin);
    const chisq=chisquareInv(siglvl,dof)/dof;
    return fftTheor[a]*chisq;
  });
}
// ==================== XWT / WTC (Torrence & Compo 1998 / Grinsted et al. 2004) ====================
function cwtRaw(z){return waveletCWT(z,1,0.25,2,24);} // memes parametres que le scalogramme OS2
function fftTheorRed(variance,lag1,period){
  return period.map(p=>{const freq=1/p;return variance*(1-lag1*lag1)/(1-2*lag1*Math.cos(freq*2*Math.PI)+lag1*lag1);});
}
function sampleVariance(x){const n=x.length,m=x.reduce((a,b)=>a+b,0)/n;return x.reduce((a,b)=>a+(b-m)**2,0)/(n-1);}
// lissage temporel gaussien (largeur ~ echelle), ligne par ligne (echelle a)
function gaussSmoothRow(row,sigma){
  const n=row.length,half=Math.min(n-1,Math.max(1,Math.ceil(sigma*3)));
  const out=new Array(n).fill(0);
  for(let t=0;t<n;t++){
    let sum=0,wsum=0;
    for(let k=-half;k<=half;k++){
      const idx=t+k;if(idx<0||idx>=n)continue;
      const w=Math.exp(-0.5*(k/sigma)**2);
      sum+=row[idx]*w;wsum+=w;
    }
    out[t]=wsum>0?sum/wsum:row[t];
  }
  return out;
}
// lissage en echelle (boxcar, largeur ~0.6/dj)
function scaleSmooth2D(grid,dj){
  const nS=grid.length,nT=grid[0].length;
  const half=Math.max(1,Math.round(0.6/dj/2));
  const out=grid.map(()=>new Array(nT).fill(0));
  for(let t=0;t<nT;t++)for(let a=0;a<nS;a++){
    let sum=0,cnt=0;
    for(let k=-half;k<=half;k++){const idx=a+k;if(idx<0||idx>=nS)continue;sum+=grid[idx][t];cnt++;}
    out[a][t]=cnt>0?sum/cnt:grid[a][t];
  }
  return out;
}
function computeWTCcoh(aRe,aIm,bRe,bIm,scale,dj){
  const nS=scale.length,nT=aRe[0].length;
  let sxyRe=[],sxyIm=[],sxx=[],syy=[];
  for(let s=0;s<nS;s++){
    const rowXyRe=[],rowXyIm=[],rowXx=[],rowYy=[];
    for(let t=0;t<nT;t++){
      const cre=aRe[s][t]*bRe[s][t]+aIm[s][t]*bIm[s][t];
      const cim=aIm[s][t]*bRe[s][t]-aRe[s][t]*bIm[s][t];
      rowXyRe.push(cre/scale[s]);rowXyIm.push(cim/scale[s]);
      rowXx.push((aRe[s][t]**2+aIm[s][t]**2)/scale[s]);
      rowYy.push((bRe[s][t]**2+bIm[s][t]**2)/scale[s]);
    }
    const sigma=Math.max(scale[s],1);
    sxyRe.push(gaussSmoothRow(rowXyRe,sigma));
    sxyIm.push(gaussSmoothRow(rowXyIm,sigma));
    sxx.push(gaussSmoothRow(rowXx,sigma));
    syy.push(gaussSmoothRow(rowYy,sigma));
  }
  sxyRe=scaleSmooth2D(sxyRe,dj);sxyIm=scaleSmooth2D(sxyIm,dj);
  sxx=scaleSmooth2D(sxx,dj);syy=scaleSmooth2D(syy,dj);
  const R2=sxyRe.map((row,s)=>row.map((v,t)=>{
    const denom=sxx[s][t]*syy[s][t];
    return denom>0?Math.min(1,(v*v+sxyIm[s][t]*sxyIm[s][t])/denom):0;
  }));
  return{R2};
}
function ar1Surrogate(n,lag1){
  const x=[];let prev=0;
  for(let i=0;i<n;i++){
    const u1=Math.random()||1e-9,u2=Math.random();
    const g=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);
    prev=i===0?g:lag1*prev+Math.sqrt(Math.max(0,1-lag1*lag1))*g;
    x.push(prev);
  }
  return x;
}
// Calcule XWT + WTC (+ significativite) entre deux series standardisees (meme longueur)
function computeXWTWTC(zx,zy){
  const a=cwtRaw(zx),b=cwtRaw(zy);
  const nS=a.scale.length,nT=zx.length;
  const xwtPow=[],xwtPhase=[];
  for(let s=0;s<nS;s++){
    const pr=[],ph=[];
    for(let t=0;t<nT;t++){
      const re=a.waveRe[s][t]*b.waveRe[s][t]+a.waveIm[s][t]*b.waveIm[s][t];
      const im=a.waveIm[s][t]*b.waveRe[s][t]-a.waveRe[s][t]*b.waveIm[s][t];
      pr.push(Math.sqrt(re*re+im*im));ph.push(Math.atan2(im,re));
    }
    xwtPow.push(pr);xwtPhase.push(ph);
  }
  const lag1x=lag1Autocorr(zx),lag1y=lag1Autocorr(zy);
  const varX=sampleVariance(zx),varY=sampleVariance(zy);
  const fx=fftTheorRed(varX,lag1x,a.period),fy=fftTheorRed(varY,lag1y,a.period);
  const Zv=chisquareInv(0.95,1); // approx (Grinsted), dof=1
  const xwtSig=a.period.map((p,i)=>Zv*Math.sqrt(fx[i]*fy[i]));

  const wtc=computeWTCcoh(a.waveRe,a.waveIm,b.waveRe,b.waveIm,a.scale,0.25);

  // Significativite WTC par Monte Carlo reduit (surrogates AR1, meme lag1 que les series observees)
  const NMC=25;
  const samples=a.scale.map(()=>[]);
  for(let it=0;it<NMC;it++){
    const sx=ar1Surrogate(nT,lag1x),sy=ar1Surrogate(nT,lag1y);
    const ca=cwtRaw(sx),cb=cwtRaw(sy);
    const w2=computeWTCcoh(ca.waveRe,ca.waveIm,cb.waveRe,cb.waveIm,ca.scale,0.25);
    for(let s=0;s<nS;s++)for(let t=0;t<nT;t++)samples[s].push(w2.R2[s][t]);
  }
  const wtcSig95=samples.map(arr=>{arr.sort((x,y)=>x-y);return arr[Math.min(arr.length-1,Math.floor(arr.length*0.95))];});

  return{period:a.period,coi:a.coi,scale:a.scale,xwtPow,xwtPhase,xwtSig,wtcR2:wtc.R2,wtcSig95,lag1x,lag1y};
}

// Calcule scalogramme + GWS pour une serie (standardisee au prealable par l'appelant)
function computeCWT(signal){
  const n=signal.length,dt=1,dj=0.25,s0=2*dt,j1=Math.round(6/dj);
  const{waveRe,waveIm,scale,period,coi}=waveletCWT(signal,dt,dj,s0,j1);
  const power=waveRe.map((row,a)=>row.map((v,t)=>v*v+waveIm[a][t]*waveIm[a][t]));
  const lag1=lag1Autocorr(signal);
  const signifLocal=waveSignif(signal,dt,scale,0,lag1,0.95,n); // par echelle
  const sig95=power.map((row,a)=>row.map(p=>p/signifLocal[a]));
  const gws=power.map(row=>row.reduce((a,b)=>a+b,0)/row.length);
  const signifGWS=waveSignif(signal,dt,scale,1,lag1,0.95,n);
  return{scale,period,coi,power,sig95,gws,signifGWS,lag1};
}

function xlsStats(data){
  const cols=Object.keys(data[0]).filter(c=>!c.toLowerCase().includes("date")&&c!=="Station"&&c!=="Année");
  const rows=[["Variable","Moyenne","Ecart-type","Minimum","Maximum","N valides","Manquants"]];
  cols.forEach(col=>{
    const vals=data.map(r=>parseNum(r[col])).filter(v=>v!==null&&!isNaN(v));
    if(!vals.length)return;
    const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
    const std=Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/vals.length);
    rows.push([col,+mean.toFixed(4),+std.toFixed(4),+Math.min(...vals).toFixed(4),+Math.max(...vals).toFixed(4),vals.length,data.length-vals.length]);
  });
  return rows;
}
function xls(sheets,fname){
  if(typeof XLSX==="undefined"){alert("XLSX non disponible.");return;}
  const wb=XLSX.utils.book_new();
  sheets.forEach(s=>{
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s.data),s.name);
    if(s.addStats&&s.rawData){
      try{
        const statsData=xlsStats(s.rawData);
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(statsData),"Stats_"+s.name.substring(0,20));
      }catch(e){}
    }
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(xlsMeta()),"Metadonnees");
  XLSX.writeFile(wb,fname);
}
function lire(file,cb){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:"binary",cellDates:false});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(ws,{raw:false});
      if(!json||!json.length){alert("Fichier vide.");return;}
      cb(json);
    }catch(err){alert("Erreur: "+err.message);}
  };
  r.readAsBinaryString(file);
}

function sSpearman(){
  const r=S.spearmanResults;
  const hasData = !!(S.etccdiResults && S.debitResults);

  const qSel=(q,grp)=>{
    const colors={etiage:"#4a9fe0",crue:"#e06060"};
    const cur=grp==="etiage"?S.spearmanQetiage:S.spearmanQcrue;
    const col=colors[grp];
    const sel=cur===q;
    return`<div id="qbtn-${q}" style="flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;text-align:center;border:${sel?`1px solid ${col}`:"1px solid #234055"};background:${sel?`rgba(${grp==="etiage"?"74,159,224":"220,80,80"},.15)`:"#0d2235"};color:${sel?col:"#6a9080"};">${q}</div>`;
  };

  let heatHtml="";
  if(r){
    const{mat,debits,indicesAll,sigIndices,multicol,indicesFinal}=r;
    const sig=[];
    indicesAll.forEach(idx=>debits.forEach(d=>{const c=mat[idx]&&mat[idx][d];if(c&&c.pval!==null&&c.pval<0.05)sig.push({idx,d,rho:c.rho,pval:c.pval});}));
    sig.sort((a,b)=>Math.abs(b.rho)-Math.abs(a.rho));
    const grps=[{l:"Précipitations",li:["PRCPTOT","RX1day","Rx5day","R10","R20","SDII","CDD","CWD"]},{l:"Températures",li:["SU25","TR20","TN10p","TX10p","TN90p","TX90p","WSDI","CSDI"]}];

    // 1) HEATMAP complète (indices <-> debits)
    heatHtml+=`<div class="card"><div class="card-title">Heatmap Spearman</div><div class="card-sub">* p &lt; 0.05 · ${sig.length} paires significatives</div><div style="overflow-x:auto;"><table style="border-collapse:collapse;font-size:10px;min-width:100%;"><thead><tr><th style="padding:4px 8px;color:#6a9080;text-align:left;border-bottom:1px solid #234055;">Indice</th>${debits.map(d=>`<th style="padding:4px 10px;color:#4ecba0;text-align:center;border-bottom:1px solid #234055;">${d}</th>`).join("")}</tr></thead><tbody>`;
    grps.forEach(grp=>{
      const list=grp.li.filter(i=>indicesAll.includes(i));
      if(!list.length)return;
      heatHtml+=`<tr><td colspan="${debits.length+1}" style="padding:4px 8px;font-size:10px;font-weight:700;color:#5a7a6a;text-transform:uppercase;background:#0d1b2a;">${grp.l}</td></tr>`;
      list.forEach(idx=>{
        if(!mat[idx])return;
        heatHtml+=`<tr><td style="padding:5px 8px;color:#e8f4f0;font-weight:600;white-space:nowrap;border-bottom:1px solid #1a2f42;">${idx}</td>`;
        debits.forEach(d=>{
          const c=mat[idx]&&mat[idx][d];
          if(!c||c.rho===null){heatHtml+=`<td style="padding:5px 8px;text-align:center;background:#1a2f42;">-</td>`;return;}
          const bg=heatColor(c.rho,c.pval),s=c.pval!==null&&c.pval<0.05;
          heatHtml+=`<td style="padding:5px 8px;text-align:center;background:${bg};border:${s?"2px solid "+(c.rho>0?"#4ecba0":"#e06060"):"1px solid #0d1b2a"};border-radius:3px;"><span style="color:#fff;font-weight:${s?"700":"400"};">${c.rho.toFixed(2)}${s?"*":""}</span></td>`;
        });
        heatHtml+=`</tr>`;
      });
    });
    heatHtml+=`</tbody></table></div></div>`;

    // 2) Paires significatives
    if(sig.length){
      heatHtml+=`<div class="card"><div class="card-title">Paires significatives (${sig.length})</div>`;
      sig.forEach(p=>{
        const col=p.rho>0?"#4ecba0":"#e06060";
        heatHtml+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:#0d2235;border-radius:8px;margin-bottom:5px;"><span style="font-size:12px;color:#e8f4f0;font-weight:600;">${p.idx} → ${p.d}</span><div style="text-align:right;"><div style="font-size:12px;color:${col};font-weight:700;">rho=${p.rho>0?"+":""}${p.rho.toFixed(3)}*</div><div style="font-size:10px;color:#4a6a5a;">p=${p.pval.toFixed(4)}</div></div></div>`;
      });
      heatHtml+=`</div>`;
    }

    // 3) Multicolinéarité, uniquement sur les indices significatifs, separement precip / temp
    const mcCard=(label,mc)=>{
      let h=`<div class="card"><div class="card-title">Multicolinearité — ${label}</div><div class="card-sub">Indices significatifs uniquement · seuil |rho| &gt;= 0.95</div>`;
      if(!mc.all.length){
        h+=`<div class="alert alert-info" style="margin-top:0;">Aucun indice ${label.toLowerCase()} significatif avec les debits.</div>`;
      } else {
        const exList=Object.keys(mc.excluded);
        if(exList.length){
          exList.forEach(idx=>{
            const e=mc.excluded[idx];
            h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:#0d2235;border-radius:8px;margin-bottom:5px;"><span style="font-size:12px;color:#e06060;font-weight:600;">${idx} — exclu</span><div style="text-align:right;"><div style="font-size:11px;color:#8ab5a5;">corr. avec ${e.with} (rho=${e.rho.toFixed(3)})</div><div style="font-size:10px;color:#4a6a5a;">|rho debits|: ${idx}=${e.loserScore.toFixed(3)} vs ${e.with}=${e.winnerScore.toFixed(3)} (conserve)</div></div></div>`;
          });
        } else {
          h+=`<div class="alert alert-success" style="margin-top:0;">Aucune paire &gt;= 0.95 — tous conservés.</div>`;
        }
        h+=`<div style="margin-top:8px;padding:8px;background:#0d2235;border-radius:8px;font-size:11px;color:#8ab5a5;">Retenus : <strong style="color:#4ecba0;">${mc.retained.join(", ")||"-"}</strong></div>`;
      }
      h+=`</div>`;
      return h;
    };
    heatHtml+=mcCard("Précipitations",multicol.precip);
    heatHtml+=mcCard("Températures",multicol.temp);

    heatHtml+=`<div class="card"><div class="card-title">Indices retenus (finaux)</div><div class="card-sub">Significatifs + multicolinearité filtrée</div><div style="font-size:12px;color:#e8f4f0;line-height:1.8;">${indicesFinal.length?indicesFinal.join(", "):"Aucun indice retenu."}</div></div>`;
  }

  return`${hdr("Analyse Spearman","Corrélation de Spearman")}<div class="content">
    <div class="card">
      <div class="card-title">Source des donnees</div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:#0d2235;border-radius:8px;">
          <span style="font-size:12px;color:#8ab5a5;">Indices ETCCDI calculés</span>
          <span style="font-weight:700;font-size:11px;color:${S.etccdiResults?"#4ecba0":"#e06060"};">${S.etccdiResults?"Disponible":"Manquant"}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:#0d2235;border-radius:8px;">
          <span style="font-size:12px;color:#8ab5a5;">Percentiles débits calculés</span>
          <span style="font-weight:700;font-size:11px;color:${S.debitResults?"#4ecba0":"#e06060"};">${S.debitResults?"Disponible":"Manquant"}</span>
        </div>
      </div>
      ${!hasData?`<div class="alert alert-info" style="margin-top:8px;">Calculez d'abord les indices ETCCDI et les percentiles de débits.</div>`:""}
    </div>

    <div class="card">
      <div class="card-title">Base fusionnée (automatique)</div>
      <div class="card-sub">Année | Q5 Q10 Q50 Q90 Q95 | indices precip (moy. 25 stations) | indices temp (moy. 4 stations)</div>
      ${hasData?`<div class="alert alert-success">Base prete — ${(S.debitResults?.annees||[]).length} annees fusionnées.</div><button class="btn-secondary" onclick="expFusion()">Exportez la base fusionnée (Excel)</button>`:`<div class="alert alert-info">En attente des indices ETCCDI et des percentiles de débits.</div>`}
    </div>

    <div class="card">
      <div class="card-title">Choix des indicateurs</div>
      <div style="margin-bottom:10px;">
        <div style="font-size:12px;color:#8ab5a5;margin-bottom:6px;font-weight:600;">Indicateur d'étiage</div>
        <div style="display:flex;gap:8px;">${["Q5","Q10"].map(q=>qSel(q,"etiage")).join("")}</div>
      </div>
      <div>
        <div style="font-size:12px;color:#8ab5a5;margin-bottom:6px;font-weight:600;">Indicateur de crue</div>
        <div style="display:flex;gap:8px;">${["Q90","Q95"].map(q=>qSel(q,"crue")).join("")}</div>
      </div>
      <div style="margin-top:10px;padding:8px;background:#0d2235;border-radius:8px;font-size:11px;color:#8ab5a5;text-align:center;">
        Débits: <strong style="color:#4ecba0;">${S.spearmanQetiage} · Q50 · ${S.spearmanQcrue}</strong>
      </div>
    </div>

    <button class="btn-primary" onclick="runSpearman()">Calculez la matrice de Spearman</button>
    ${r?`<button class="btn-secondary" onclick="expSpearman()">Exportez la matrice (Excel)</button>`:""}
    ${heatHtml}
  </div> `;
}

function getXWTCouples(){
  const sr=S.spearmanResults;if(!sr||!sr.indicesFinal)return[];
  const couples=[];
  sr.indicesFinal.forEach(idx=>{
    sr.debits.forEach(d=>{
      const c=sr.mat[idx]&&sr.mat[idx][d];
      if(c&&c.pval!==null&&c.pval<0.05)couples.push({idx,d,rho:c.rho,pval:c.pval});
    });
  });
  return couples;
}
function zscoreCol(base,col){
  const raw=base.map(r=>parseNum(r[col])).map(v=>v===null?0:v);
  const n=raw.length,m=raw.reduce((a,b)=>a+b,0)/n;
  const sd=Math.sqrt(raw.reduce((a,b)=>a+(b-m)**2,0)/(n-1))||1;
  return raw.map(v=>(v-m)/sd);
}
function runXWTWTCAll(){
  const couples=getXWTCouples();
  if(!couples.length){alert("Aucun couple (indice retenu x debit) significatif — verifiez l analyse Spearman.");return;}
  const base=fusionnerBase();
  if(!base||base.length<8){alert("Base fusionnée insuffisante (min. 8 annees).");return;}
  setState({xwtwtcStatus:"Calcul en cours... (Monte Carlo, patientez)"});
  setTimeout(()=>{
    try{
      const availCols=Object.keys(base[0]);
      const t=base.map(r=>r.Année);
      const out={};
      couples.forEach(({idx,d,rho,pval})=>{
        const cIdx=availCols.find(c=>c.toLowerCase()===idx.toLowerCase());
        const cD=availCols.find(c=>c.toLowerCase()===d.toLowerCase());
        if(!cIdx||!cD)return;
        const zx=zscoreCol(base,cIdx),zy=zscoreCol(base,cD);
        const full=computeXWTWTC(zx,zy);
        const cropIdx=full.period.map((p,i)=>i).filter(i=>full.period[i]>=2&&full.period[i]<=16);
        out[idx+"__"+d]={
          idx,d,rho,pval,
          period:cropIdx.map(i=>full.period[i]),
          xwtPow:cropIdx.map(i=>full.xwtPow[i]),
          xwtPhase:cropIdx.map(i=>full.xwtPhase[i]),
          xwtSig:cropIdx.map(i=>full.xwtSig[i]),
          wtcR2:cropIdx.map(i=>full.wtcR2[i]),
          wtcSig95:cropIdx.map(i=>full.wtcSig95[i]),
          coi:full.coi,lag1x:full.lag1x,lag1y:full.lag1y,
        };
      });
      setState({xwtwtcResults:{t,pairs:out},xwtwtcStatus:"Calcul terminé avec succès"});
    }catch(err){setState({xwtwtcStatus:"Erreur: "+err.message});}
  },50);
}
function runCWTAll(){
  const base=fusionnerBase();
  if(!base||base.length<8){alert("Base fusionnée insuffisante (min. 8 annees) pour la CWT.");return;}
  const sr=S.spearmanResults;
  if(!sr||!sr.indicesFinal){alert("Lancez d abord l analyse Spearman (avec sa selection multicolinearite) : les scalogrammes se basent sur les indices retenus a cette etape.");return;}
  setState({cwtStatus:"Calcul en cours..."});
  setTimeout(()=>{
    try{
      const availCols=Object.keys(base[0]);
      // Variables dynamiques = debits utilises pour Spearman + indices retenus (significatifs + filtres multicolinearite)
      const wanted=[...sr.debits,...sr.indicesFinal];
      const cols=wanted.map(w=>availCols.find(c=>c.toLowerCase()===w.toLowerCase())).filter((c,i,a)=>c&&a.indexOf(c)===i);
      if(!cols.length){alert("Aucune variable retenue par l analyse Spearman n a ete trouvee dans la base fusionnée.");setState({cwtStatus:""});return;}
      const t=base.map(r=>r.Année);
      const out={};
      cols.forEach(c=>{
        const raw=base.map(r=>parseNum(r[c])).map(v=>v===null?0:v);
        const n=raw.length,m=raw.reduce((a,b)=>a+b,0)/n;
        const sd=Math.sqrt(raw.reduce((a,b)=>a+(b-m)**2,0)/(n-1))||1; // ecart-type d echantillon (zscore MATLAB)
        const z=raw.map(v=>(v-m)/sd);
        const full=computeCWT(z);
        // Recadrage sur 2-16 ans (identique au script MATLAB : idx_period = find(period>=2 & period<=16))
        const idx=full.period.map((p,i)=>i).filter(i=>full.period[i]>=2&&full.period[i]<=16);
        out[c]={
          period:idx.map(i=>full.period[i]),
          power:idx.map(i=>full.power[i]),
          sig95:idx.map(i=>full.sig95[i]),
          gws:idx.map(i=>full.gws[i]),
          signifGWS:idx.map(i=>full.signifGWS[i]),
          coi:full.coi,lag1:full.lag1,
        };
      });
      setState({cwtResults:{t,vars:out},cwtStatus:"Calcul terminé avec succès"});
    }catch(err){setState({cwtStatus:"Erreur: "+err.message});}
  },50);
}
const CWT_COLORMAP=(()=>{ // approx colormap jet
  const stops=[[0,0,131],[0,60,170],[5,255,255],[255,255,0],[250,0,0],[128,0,0]];
  return v=>{
    v=Math.max(0,Math.min(1,v));
    const p=v*(stops.length-1),i=Math.floor(p),f=p-i,a=stops[i],b=stops[Math.min(i+1,stops.length-1)];
    return[Math.round(a[0]+(b[0]-a[0])*f),Math.round(a[1]+(b[1]-a[1])*f),Math.round(a[2]+(b[2]-a[2])*f)];
  };
})();
// Restreint l affichage a la plage de periodes 2-16 ans (comme idx_period dans le script MATLAB)
function restrictCWT(res){
  const idx=res.period.map((p,i)=>i).filter(i=>res.period[i]>=2&&res.period[i]<=16);
  return{

    power:idx.map(i=>res.power[i]),
    sig95:idx.map(i=>res.sig95[i]),
    gws:idx.map(i=>res.gws[i]),
    signifGWS:idx.map(i=>res.signifGWS[i]),

  };
}

// ---- Axes (annees en X, periodes en Y) dessines directement sur le canvas ----
function axisMargins(W,H){
  const mL=Math.round(W*0.11),mB=Math.round(H*0.14),mT=Math.round(H*0.03),mR=Math.round(W*0.02);
  return{mL,mB,mT,mR,pX:mL,pY:mT,pW:W-mL-mR,pH:H-mT-mB};
}
function niceYearTicks(t0,t1,maxTicks){
  const span=t1-t0;if(span<=0)return[t0];
  let step=Math.pow(10,Math.floor(Math.log10(span/maxTicks||1)));
  const mult=[1,2,2.5,5,10];
  let best=step*10;
  for(const m of mult){const cand=step*m;if(span/cand<=maxTicks){best=cand;break;}}
  const start=Math.ceil(t0/best)*best;
  const ticks=[];
  for(let v=start;v<=t1+1e-6;v+=best)ticks.push(Math.round(v));
  return ticks.length?ticks:[t0,t1];
}
function drawAxes(ctx,m,W,H,t,periodTicks,pMin,pMax){
  const{pX,pY,pW,pH}=m;
  ctx.save();
  ctx.strokeStyle="#4a6a5a";ctx.fillStyle="#8ab5a5";
  ctx.font=Math.max(9,Math.round(W*0.018))+"px sans-serif";
  ctx.lineWidth=1;
  // cadre
  ctx.strokeRect(pX+0.5,pY+0.5,pW,pH);
  // ticks Y (periodes)
  ctx.textAlign="right";ctx.textBaseline="middle";
  periodTicks.forEach(pv=>{
    const plog=Math.log2(pv);
    if(plog<pMin-1e-6||plog>pMax+1e-6)return;
    const py=pY+((plog-pMin)/(pMax-pMin))*pH;
    ctx.beginPath();ctx.moveTo(pX-4,py);ctx.lineTo(pX,py);ctx.stroke();
    ctx.fillText(String(pv),pX-7,py);
  });
  // ticks X (annees)
  const nT=t.length;
  const yrTicks=niceYearTicks(t[0],t[nT-1],Math.max(3,Math.round(pW/70)));
  ctx.textAlign="center";ctx.textBaseline="top";
  yrTicks.forEach(yr=>{
    const frac=(yr-t[0])/(t[nT-1]-t[0]||1);
    if(frac<-0.02||frac>1.02)return;
    const px=pX+frac*pW;
    ctx.beginPath();ctx.moveTo(px,pY+pH);ctx.lineTo(px,pY+pH+4);ctx.stroke();
    ctx.fillText(String(yr),px,pY+pH+6);
  });
  // labels axes
  ctx.fillStyle="#a8c5b8";
  ctx.font=Math.max(10,Math.round(W*0.02))+"px sans-serif";
  ctx.textAlign="center";ctx.textBaseline="alphabetic";
  ctx.fillText("Année",pX+pW/2,H-4);
  ctx.save();
  ctx.translate(Math.max(10,pX*0.32),pY+pH/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText("Période (ans)",0,0);
  ctx.restore();
  ctx.restore();
}
function drawCWTCard(canvasId,r,t){
  const cvs=document.getElementById(canvasId);
  if(!cvs)return;
  const ctx=cvs.getContext("2d");
  const W=cvs.width,H=cvs.height;
  ctx.clearRect(0,0,W,H);
  const m=axisMargins(W,H);const{pX,pY,pW,pH}=m;
  const nT=t.length,nS=r.period.length;
  const periodLog=r.period.map(p=>Math.log2(p));
  const pMin=Math.min(...periodLog),pMax=Math.max(...periodLog);
  const maxPow=Math.max(...r.power.flat());
  const img=ctx.createImageData(pW,pH);
  for(let py=0;py<pH;py++){
    const plog=pMin+(py/(pH-1))*(pMax-pMin); // haut=periode courte
    let a0=0;while(a0<nS-2&&periodLog[a0+1]<plog)a0++;
    const a1=Math.min(a0+1,nS-1);
    const span=periodLog[a1]-periodLog[a0];
    const fa=span>0?Math.max(0,Math.min(1,(plog-periodLog[a0])/span)):0;
    for(let px=0;px<pW;px++){
      const tiCont=(px/(pW-1))*(nT-1);
      const t0=Math.floor(tiCont),t1=Math.min(t0+1,nT-1),ft=tiCont-t0;
      const v00=r.power[a0][t0],v01=r.power[a0][t1],v10=r.power[a1][t0],v11=r.power[a1][t1];
      const vTop=v00+(v01-v00)*ft,vBot=v10+(v11-v10)*ft;
      const val=(vTop+(vBot-vTop)*fa)/(maxPow||1);
      const[cr,cg,cb]=CWT_COLORMAP(val);
      const idx=(py*pW+px)*4;
      img.data[idx]=cr;img.data[idx+1]=cg;img.data[idx+2]=cb;img.data[idx+3]=255;
    }
  }
  ctx.putImageData(img,pX,pY);
  // COI (zone non fiable) : voile semi-transparent, clampe sur [pMin,pMax] comme le script MATLAB
  ctx.save();ctx.globalAlpha=0.45;ctx.fillStyle="#0d1b2a";
  ctx.beginPath();
  for(let px=0;px<pW;px++){
    const ti=Math.min(nT-1,Math.floor((px/(pW-1))*(nT-1)));
    let coiLog=Math.log2(Math.max(r.coi[ti],1e-5));
    coiLog=Math.max(pMin,Math.min(pMax,coiLog));
    const py=pY+((coiLog-pMin)/(pMax-pMin))*pH;
    if(px===0)ctx.moveTo(pX+px,py);else ctx.lineTo(pX+px,py);
  }
  ctx.lineTo(pX+pW,pY);ctx.lineTo(pX,pY);ctx.closePath();ctx.fill();ctx.restore();
  // Contour de significativite (bord des cellules ou sig95>=1)
  ctx.save();ctx.strokeStyle="#111";ctx.lineWidth=1.3;ctx.beginPath();
  for(let py=0;py<pH;py++){
    const plog=pMin+(py/(pH-1))*(pMax-pMin);
    let a=0;while(a<nS-1&&periodLog[a+1]<plog)a++;
    let prevSig=null;
    for(let px=0;px<pW;px++){
      const ti=Math.min(nT-1,Math.floor((px/(pW-1))*(nT-1)));
      const sig=r.sig95[a][ti]>=1;
      if(prevSig!==null&&sig!==prevSig){ctx.moveTo(pX+px,pY+py);ctx.lineTo(pX+px,pY+py+1);}
      prevSig=sig;
    }
  }
  ctx.stroke();ctx.restore();
  const periodTicks=[2,4,8,16].filter(pv=>Math.log2(pv)>=pMin-0.3&&Math.log2(pv)<=pMax+0.3);
  drawAxes(ctx,m,W,H,t,periodTicks,pMin,pMax);
}

// ---- Rendu XWT / WTC (heatmap + fleches de phase, noires si dans le COI, grises sinon) ----
function drawXWTWTCCard(canvasId,res,t,mode){
  const cvs=document.getElementById(canvasId);
  if(!cvs)return;
  const ctx=cvs.getContext("2d");
  const W=cvs.width,H=cvs.height;
  ctx.clearRect(0,0,W,H);
  const nT=t.length,nS=res.period.length;
  const periodLog=res.period.map(p=>Math.log2(p));
  const pMin=Math.min(...periodLog),pMax=Math.max(...periodLog);
  const grid=mode==="xwt"?res.xwtPow:res.wtcR2;
  const sigGrid=mode==="xwt"?res.xwtSig:res.wtcSig95;
  const maxVal=mode==="xwt"?Math.max(...grid.flat()):1;
  const img=ctx.createImageData(W,H);
  for(let py=0;py<H;py++){
    const plog=pMin+(py/(H-1))*(pMax-pMin);
    let a0=0;while(a0<nS-2&&periodLog[a0+1]<plog)a0++;
    const a1=Math.min(a0+1,nS-1);
    const span=periodLog[a1]-periodLog[a0];
    const fa=span>0?Math.max(0,Math.min(1,(plog-periodLog[a0])/span)):0;
    for(let px=0;px<W;px++){
      const tiCont=(px/(W-1))*(nT-1);
      const t0=Math.floor(tiCont),t1=Math.min(t0+1,nT-1),ft=tiCont-t0;
      const v00=grid[a0][t0],v01=grid[a0][t1],v10=grid[a1][t0],v11=grid[a1][t1];
      const vTop=v00+(v01-v00)*ft,vBot=v10+(v11-v10)*ft;
      const val=(vTop+(vBot-vTop)*fa)/(maxVal||1);
      const[cr,cg,cb]=CWT_COLORMAP(val);
      const idx=(py*W+px)*4;
      img.data[idx]=cr;img.data[idx+1]=cg;img.data[idx+2]=cb;img.data[idx+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  // COI
  ctx.save();ctx.globalAlpha=0.45;ctx.fillStyle="#0d1b2a";ctx.beginPath();
  for(let px=0;px<W;px++){
    const ti=Math.min(nT-1,Math.floor((px/(W-1))*(nT-1)));
    let coiLog=Math.log2(Math.max(res.coi[ti],1e-5));
    coiLog=Math.max(pMin,Math.min(pMax,coiLog));
    const py=((coiLog-pMin)/(pMax-pMin))*(H-1);
    if(px===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.lineTo(W,0);ctx.lineTo(0,0);ctx.closePath();ctx.fill();ctx.restore();
  // contour significativite
  ctx.save();ctx.strokeStyle="#111";ctx.lineWidth=1.3;ctx.beginPath();
  for(let py=0;py<H;py++){
    const plog=pMin+(py/(H-1))*(pMax-pMin);
    let a=0;while(a<nS-1&&periodLog[a+1]<plog)a++;
    let prevSig=null;
    for(let px=0;px<W;px++){
      const ti=Math.min(nT-1,Math.floor((px/(W-1))*(nT-1)));
      const sig=grid[a][ti]>=sigGrid[a];
      if(prevSig!==null&&sig!==prevSig){ctx.moveTo(px,py);ctx.lineTo(px,py+1);}
      prevSig=sig;
    }
  }
  ctx.stroke();ctx.restore();
  // fleches de phase (grille eparse, noires si dans le COI, grises sinon)
  if(res.xwtPhase){
    const nx=Math.min(14,nT),ny=Math.min(9,nS);
    const arrowLen=Math.min(W/nx,H/ny)*0.38;
    for(let iy=0;iy<ny;iy++){
      const plog=pMin+((iy+0.5)/ny)*(pMax-pMin);
      let a=0;while(a<nS-2&&periodLog[a+1]<plog)a++;
      for(let ix=0;ix<nx;ix++){
        const ti=Math.min(nT-1,Math.round(((ix+0.5)/nx)*(nT-1)));
        const px=((ix+0.5)/nx)*W,py=((iy+0.5)/ny)*H;
        const phase=res.xwtPhase[a][ti];
        let coiLog=Math.log2(Math.max(res.coi[ti],1e-5));
        const reliable=periodLog[a]<=coiLog;
        ctx.save();
        ctx.strokeStyle=reliable?"#111":"rgba(120,120,120,.55)";
        ctx.fillStyle=ctx.strokeStyle;
        ctx.lineWidth=1;
        ctx.translate(px,py);ctx.rotate(phase);
        ctx.beginPath();ctx.moveTo(-arrowLen/2,0);ctx.lineTo(arrowLen/2,0);ctx.stroke();
        ctx.beginPath();ctx.moveTo(arrowLen/2,0);ctx.lineTo(arrowLen/2-4,-2.5);ctx.lineTo(arrowLen/2-4,2.5);ctx.closePath();ctx.fill();
        ctx.restore();
      }
    }
  }
}

function sAlertes(){
  const base = fusionnerBase(); 
  if(!base || base.length === 0) return `${hdr("Diagnostic des Extrêmes",null,true)}<div class="content"><div class="alert alert-info">Calculez les indices ETCCDI pour générer le diagnostic.</div></div>`;

  const yearKey = Object.keys(base[0])[0];

  // On s'assure que PRCPTOT est bien un nombre pour le tri
  const sortedByRain = [...base].sort((a, b) => parseNum(b.PRCPTOT) - parseNum(a.PRCPTOT));

      // On récupère l'année de manière dynamique

      return `
        <div class="card" style="border-top: 4px solid ${color}; background: #1a2f42;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">

      `;
  }

  return `
    ${hdr("Diagnostic des Extrêmes", "Mise en évidence des signatures de rupture", true)}

function fusionnerBase(){
  const debitR = S.debitResults;
  const precipR = S.etccdiResults && S.etccdiResults.precip;
  const tempR   = S.etccdiResults && S.etccdiResults.temp;
  if(!debitR) return null;
  const yrs = debitR.annees;
  const indP=["PRCPTOT","RX1day","Rx5day","R10","R20","SDII","CDD","CWD"];
  const indT=["SU25","TR20","TN10p","TX10p","TN90p","TX90p","WSDI","CSDI"];
  function moy(res,inds){
    if(!res)return null;
    const sts=Object.keys(res);
    const out={};
    yrs.forEach((an,i)=>{
      out[an]={};
      inds.forEach(idx=>{
        const vals=sts.map(st=>res[st][idx]?res[st][idx][i]:null).filter(v=>v!==null&&!isNaN(v));
        out[an][idx]=vals.length>0?(vals.reduce((a,b)=>a+b,0)/vals.length):null;
      });
    });
    return out;
  }
  const mP=moy(precipR,indP);
  const mT=moy(tempR,indT);
  return yrs.map((an,i)=>{
    const row={Année:an};
    ["Q5","Q10","Q50","Q90","Q95"].forEach(q=>row[q]=debitR[q]?debitR[q][i]:null);
    indP.forEach(idx=>row[idx]=mP?mP[an][idx]:null);
    indT.forEach(idx=>row[idx]=mT?mT[an][idx]:null);
    return row;
  });
}

function runSpearman(){
  const source = "calcule";
  const base = (S.etccdiResults && S.debitResults) ? fusionnerBase() : null;

  if(!base||base.length<3){
    alert("Calculez d abord les indices ETCCDI et les percentiles de debits (au moins 3 annees).");
    return;
  }

  const cols=Object.keys(base[0]);
  const ac=cols.find(c=>c.toLowerCase().includes("ann")||c.toLowerCase().includes("year"))||cols[0];
  const dkws=["q5","q10","q50","q90","q95"];
  let dc=cols.filter(c=>dkws.some(k=>c.toLowerCase().replace(/[^a-z0-9]/g,"")===k));
  if(!dc.length)dc=cols.slice(1,4);
  const chosen=[];
  ["Q50",S.spearmanQetiage,S.spearmanQcrue].forEach(q=>{
    const m=cols.find(c=>c.toLowerCase().replace(/[^a-z0-9]/g,"")==q.toLowerCase().replace(/[^a-z0-9]/g,""));
    if(m&&!chosen.includes(m))chosen.push(m);
  });
  const final=chosen.length?chosen:dc.slice(0,3);
  const indColsAll=cols.filter(c=>c!==ac&&!dc.includes(c));

  // ---- ETAPE 1 : Heatmap Spearman indices <-> debits (tous les indices) ----
  const mat={};
  indColsAll.forEach(idx=>{
    mat[idx]={};
    const x=base.map(r=>parseNum(r[idx]));
    final.forEach(d=>{mat[idx][d]=spearman(x,base.map(r=>parseNum(r[d])));});
  });

  // ---- ETAPE 2 : filtrage des indices significatifs (p < 0.05 avec au moins un debit) ----
  const sigIndices=indColsAll.filter(idx=>final.some(d=>{
    const c=mat[idx][d];return c&&c.pval!==null&&c.pval<0.05;
  }));

  // ---- ETAPE 3 : multicolinearite, separement precip et temp, uniquement sur les indices significatifs ----
  const grpDefs={
    precip:["PRCPTOT","RX1day","Rx5day","R10","R20","SDII","CDD","CWD"],
    temp:["SU25","TR20","TN10p","TX10p","TN90p","TX90p","WSDI","CSDI"],
  };
  const maxAbsRho=idx=>Math.max(...final.map(d=>{const c=mat[idx][d];return c&&c.rho!==null?Math.abs(c.rho):0;}));

  function multicolGroup(list){
    const excluded={},pairs=[];
    for(let i=0;i<list.length;i++){
      for(let j=i+1;j<list.length;j++){
        const a=list[i],b=list[j];
        const xa=base.map(r=>parseNum(r[a])),xb=base.map(r=>parseNum(r[b]));
        const sp=spearman(xa,xb);
        if(sp.rho!==null&&Math.abs(sp.rho)>=0.95){
          pairs.push({a,b,rho:sp.rho});
          if(excluded[a]||excluded[b])continue;
          const scoreA=maxAbsRho(a),scoreB=maxAbsRho(b);
          const loser=scoreA>=scoreB?b:a,winner=loser===a?b:a;
          const loserScore=loser===a?scoreA:scoreB,winnerScore=winner===a?scoreA:scoreB;
          excluded[loser]={with:winner,rho:sp.rho,loserScore,winnerScore};
        }
      }
    }
    const retained=list.filter(idx=>!excluded[idx]);
    return{excluded,pairs,retained,all:list};
  }

  const sigPrecip=sigIndices.filter(i=>grpDefs.precip.includes(i));
  const sigTemp=sigIndices.filter(i=>grpDefs.temp.includes(i));
  const multicol={
    precip:multicolGroup(sigPrecip),
    temp:multicolGroup(sigTemp),
  };
  const indicesFinal=[...multicol.precip.retained,...multicol.temp.retained];

  setState({spearmanResults:{mat,debits:final,indicesAll:indColsAll,sigIndices,multicol,indicesFinal,source},cwtResults:null,cwtStatus:"",xwtwtcResults:null,xwtwtcStatus:""});
}
function expSpearman(){
  const r=S.spearmanResults;if(!r)return;
  const{mat,debits,indicesAll,multicol,indicesFinal}=r;
  const rhoRows=[["Indice",...debits]];
  const pRows=[["Indice",...debits]];
  indicesAll.forEach(idx=>{
    rhoRows.push([idx,...debits.map(d=>mat[idx]&&mat[idx][d]?mat[idx][d].rho:null)]);
    pRows.push([idx,...debits.map(d=>mat[idx]&&mat[idx][d]?mat[idx][d].pval:null)]);
  });
  const sheets=[{name:"Rho_Spearman",data:rhoRows},{name:"P_values",data:pRows}];
  [["Précipitations",multicol.precip],["Températures",multicol.temp]].forEach(([label,mc])=>{
    const exList=Object.keys(mc.excluded||{});
    if(exList.length){
      const exRows=[["Indice_exclu","Correle_avec","Rho_entre_indices","RhoMax_exclu_vs_debits","RhoMax_conserve_vs_debits"]];
      exList.forEach(idx=>{const e=mc.excluded[idx];exRows.push([idx,e.with,e.rho,e.loserScore,e.winnerScore]);});
      sheets.push({name:"Exclusions_"+label,data:exRows});
    }
  });
  sheets.push({name:"Indices_retenus",data:[["Indice"],...indicesFinal.map(i=>[i])]});
  xls(sheets,"Matrice_Spearman.xlsx");
}

function updateSim(idx, val) {
    // 1. Mise à jour de l'affichage du pourcentage sur le curseur
    const elVal = document.getElementById(`val-${idx}`);
    if(elVal) elVal.textContent = (val > 0 ? "+" : "") + val + "%";
    
    const sr = S.spearmanResults;
    if(!sr) return;

    let resValues = {};
    let contributions = {}; 
    let currentScenario = {};

    // 2. CALCUL DES IMPACTS ET IDENTIFICATION DES MOTEURS (DRIVERS)
    sr.debits.forEach(debitName => {
        let totalImpact = 0;
        let maxContrib = { name: "", val: 0 };

        sr.indicesFinal.forEach(id => {
            const slider = document.querySelector(`input[oninput*="'${id}'"]`);
            if(slider) {
                const v = parseFloat(slider.value);
                currentScenario[id] = v; // Stockage pour l'analogie
                const rho = (sr.mat[id] && sr.mat[id][debitName]) ? sr.mat[id][debitName].rho : 0;
                const contrib = v * rho;
                totalImpact += contrib;
                if(Math.abs(contrib) > Math.abs(maxContrib.val)) {
                    maxContrib = { name: id, val: contrib };
                }
            }
        });

        // Mise à jour des chiffres en % dans les cartes bleues
        const resDisplay = document.getElementById(`sim-res-${debitName}`);
        if(resDisplay) {
            resDisplay.textContent = (totalImpact > 0 ? "+" : "") + totalImpact.toFixed(1) + " %";
            resDisplay.style.color = totalImpact >= 0 ? "#4ecba0" : "#e06060";
        }
        resValues[debitName] = totalImpact;
        contributions[debitName] = maxContrib;
    });

    // 3. MISE À JOUR DE LA JAUGE DE VULNÉRABILITÉ
    const gauge = document.getElementById('vulnerability-gauge');
    const nameEtiage = sr.debits[0]; 
    const nameCrue   = sr.debits[sr.debits.length - 1]; 
    
    // On calcule le risque cumulé (Crue ou Sécheresse)
    const riskScore = Math.max(Math.abs(resValues[nameCrue]), Math.abs(resValues[nameEtiage]));
    
    if(riskScore > 25) {
        gauge.textContent = "CRITIQUE";
        gauge.style.color = "#e06060";
    } else if(riskScore > 10) {
        gauge.textContent = "MODÉRÉE";
        gauge.style.color = "#e0a060";
    } else {
        gauge.textContent = "STABLE";
        gauge.style.color = "#4ecba0";
    }

    // 4. ANALOGIE HISTORIQUE
    const analogyDiv = document.getElementById('analogy-box');
    let match = "";
    if(currentScenario["Rx5day"] > 20 || currentScenario["PRCPTOT"] > 20) {
        match = "⭐ <strong>Analogie :</strong> Ce scénario (forte pluviosité) rappelle l'année <strong>2010 (Inondations)</strong>.";
    } else if(currentScenario["CDD"] > 20 || currentScenario["CSDI"] > 15) {
        match = "⭐ <strong>Analogie :</strong> Ce scénario (sécheresse/froid) est proche de l'année <strong>2015 (Sécheresse Sévère)</strong>.";
    }
    
    if(match !== "") {
        analogyDiv.style.display = 'block';
        analogyDiv.innerHTML = match;
    } else {
        analogyDiv.style.display = 'none';
    }

    // 5. DIAGNOSTIC ET DIRECTIVES (TEXTES)
    const interpDiv = document.getElementById('interpretation-text');
    const adviceDiv = document.getElementById('advice-text');
    let interp = [];
    let recom = [];

    sr.debits.forEach(dName => {
        const v = resValues[dName];
        const driver = contributions[dName].name;
        if (Math.abs(v) > 3) {
            if (dName === "Q95" || dName === "Q90") {
                interp.push(`Les <strong>Hautes Eaux (${dName})</strong> sont impactées par <strong>${driver}</strong> (+${v.toFixed(1)}%).`);
                if (v > 15) recom.push("🚩 <strong>ALERTE :</strong> Risque de crue. Surveiller l'exutoire de Bonou.");
            }
            if (dName === "Q5" || dName === "Q10") {
                interp.push(`Le <strong>Régime d'Étiage (${dName})</strong> est affaibli par <strong>${driver}</strong> (${v.toFixed(1)}%).`);
                if (v < -10) recom.push("🚜 <strong>ALERTE :</strong> Stress hydrique. Planifier la gestion des pompages.");
            }
        }
    });

    if(interp.length === 0) interp.push("Forçages trop faibles pour modifier la signature du bassin.");
    if(recom.length === 0) recom.push("Poursuivre le monitoring standard.");

    interpDiv.innerHTML = interp.join("<br>");
    adviceDiv.innerHTML = recom.join("<br>");

function updateUIAfterProjection(data, message) {
    const status = document.getElementById('ai-status');
    const tableDiv = document.getElementById('ai-results-table');
    const rowsBody = document.getElementById('ai-rows');
    const sr = S.spearmanResults;

    // A. Mise à jour physique des sliders
    sr.indicesFinal.forEach(idx => {
        const slider = document.getElementById(`slider-${idx}`);
        if(slider && data[idx] !== undefined) {
            slider.value = data[idx];
            // On met à jour l'étiquette texte du pourcentage
            const label = document.getElementById(`val-${idx}`);
            if(label) label.textContent = (data[idx] > 0 ? "+" : "") + data[idx] + "%";
        }
    });

    // B. Lancement du calcul global des débits (Q5, Q50, Q95)
    // On appelle updateSim une seule fois sur le dernier indice pour tout rafraîchir
    if(sr.indicesFinal.length > 0) {
        updateSim(sr.indicesFinal[0], data[sr.indicesFinal[0]]);
    }

    // C. Remplissage du tableau de synthèse 2045
    let html = "";
    sr.indicesFinal.forEach(idx => {
        if(data[idx] !== undefined) {
            const v = data[idx];
            html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                <td style="padding:6px 0; color:#8ab5a5; font-size:11px;">${idx}</td>
                <td style="text-align:right; font-weight:800; color:#4ecba0; font-size:11px;">${v > 0 ? "+" : ""}${v}%</td>
            </tr>`;
        }
    });

    if(rowsBody) rowsBody.innerHTML = html;
    if(tableDiv) tableDiv.style.display = 'block';
    if(status) status.innerHTML = message;
}
